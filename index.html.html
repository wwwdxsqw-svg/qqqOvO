/* 整页复古电话亭：结构化交互，不是装饰贴片；所有色彩跟随当前主题变量 */
#appScreen:has(.booth-room) .app-main{padding:8px 12px 24px;}
.booth-room{--booth-accent:var(--accent);--booth-ink:var(--ink);--booth-muted:var(--muted);position:relative;min-height:100%;padding:8px 9px 20px;border-radius:25px;background:linear-gradient(145deg,var(--glass-strong),var(--glass));border:1px solid var(--glass-border);box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 12px 30px var(--shadow);backdrop-filter:blur(var(--blur)) saturate(150%);-webkit-backdrop-filter:blur(var(--blur)) saturate(150%);overflow:hidden}
.booth-room:before{content:"";position:absolute;inset:7px;border:2px solid color-mix(in srgb,var(--accent) 64%,transparent);border-radius:20px;pointer-events:none}
.booth-marquee{position:relative;display:flex;align-items:center;gap:11px;margin:8px 7px 0;padding:14px 13px 13px;border-radius:13px 13px 5px 5px;background:linear-gradient(135deg,var(--glass-strong),var(--soft));border:1px solid var(--glass-border);box-shadow:inset 0 0 0 3px var(--glass),0 4px 12px var(--shadow);z-index:1}
.booth-marquee>div{flex:1;min-width:0}.booth-marquee small{font-size:7px;letter-spacing:1.4px;color:var(--booth-muted)}.booth-marquee h2{font-family:Georgia,"Songti SC",serif;font-size:24px;letter-spacing:.08em;margin:5px 0;color:var(--booth-ink)}.booth-marquee p{font-size:10px;margin:0;color:var(--booth-muted)}.booth-live{display:flex;align-items:center;gap:5px;font-size:9px;color:var(--booth-muted);white-space:nowrap;align-self:flex-start}.booth-live i,.booth-led{display:inline-block;width:6px;height:6px;border-radius:50%;background:#7fa78b;box-shadow:0 0 0 3px color-mix(in srgb,#7fa78b 18%,transparent)}
.booth-glass-door{position:relative;margin:10px 7px 8px;padding:9px 10px 12px;border:3px solid color-mix(in srgb,var(--accent) 62%,var(--muted));border-radius:9px 9px 5px 5px;background:linear-gradient(110deg,var(--glass-strong),var(--glass) 46%,var(--soft));box-shadow:inset 0 0 0 3px var(--glass-border),inset 0 0 0 7px var(--glass),0 6px 14px var(--shadow);overflow:hidden}
.booth-window-top{display:flex;justify-content:space-between;padding:3px 5px 7px;border-bottom:1px solid var(--glass-border);font:600 7px Georgia,serif;letter-spacing:1.5px;color:var(--booth-muted)}.booth-window-grid{position:absolute;inset:31px 13px auto;height:92px;display:grid;grid-template-columns:repeat(3,1fr);pointer-events:none;opacity:.32}.booth-window-grid i{border-right:2px solid var(--accent);border-bottom:2px solid var(--accent)}.booth-window-grid i:nth-child(3n){border-right:0}.booth-console{position:relative;z-index:1;min-height:139px;margin:13px 1px 10px;border-radius:11px;padding:10px 10px 8px;background:linear-gradient(145deg,var(--glass-strong),var(--soft));border:1px solid var(--glass-border);box-shadow:0 5px 14px var(--shadow),inset 0 1px 0 rgba(255,255,255,.65);display:grid;grid-template-columns:1fr 88px;grid-template-rows:72px auto;gap:7px 10px}
.booth-receiver{position:relative;width:100%;height:34px;align-self:center;display:flex;align-items:center;justify-content:space-between;padding:0 5px;transform:rotate(-7deg);filter:drop-shadow(0 4px 3px var(--shadow))}.booth-receiver:before{content:"";position:absolute;left:10px;right:10px;height:18px;border-radius:9px;background:linear-gradient(180deg,var(--glass-strong),var(--soft));border:2px solid var(--accent)}.booth-receiver span{position:relative;z-index:1;width:23px;height:30px;border-radius:8px;border:2px solid var(--accent);background:repeating-linear-gradient(90deg,var(--glass-strong) 0 2px,var(--soft) 2px 4px)}.booth-receiver b{position:relative;z-index:2;width:12px;height:12px;border-radius:50%;background:var(--accent);box-shadow:inset 0 0 0 3px var(--glass-strong)}
.booth-cord{position:absolute;left:13px;top:43px;width:30px;height:30px;display:flex;align-items:center;justify-content:center;gap:2px;transform:rotate(10deg)}.booth-cord i{height:21px;width:4px;border:1px solid var(--accent);border-radius:50%}.booth-cord b{position:absolute;bottom:-2px;left:12px;width:6px;height:12px;border-radius:2px;background:var(--accent)}
.booth-dial{position:relative;grid-column:2;grid-row:1/3;width:82px;height:82px;align-self:center;justify-self:center;border-radius:50%;border:4px solid color-mix(in srgb,var(--accent) 65%,var(--glass-border));background:radial-gradient(circle,var(--glass-strong) 0 42%,var(--soft) 43% 68%,var(--glass-strong) 69%);box-shadow:inset 0 0 0 3px var(--glass-border),0 4px 10px var(--shadow)}.booth-dial-center{position:absolute;inset:27px;border-radius:50%;display:grid;place-items:center;background:var(--glass-strong);border:1px solid var(--glass-border);font:italic 17px Georgia,serif;color:var(--booth-ink)}.booth-dial i{position:absolute;left:50%;top:50%;width:15px;height:15px;display:grid;place-items:center;border-radius:50%;font:600 7px Georgia,serif;color:var(--booth-ink);background:var(--glass-strong);border:1px solid var(--glass-border);transform:rotate(calc(var(--n)*36deg)) translateY(-31px) rotate(calc(var(--n)*-36deg));font-style:normal}.booth-key-label{grid-column:1;grid-row:2;align-self:end;font-size:7px;letter-spacing:1.5px;color:var(--booth-muted);padding-left:5px}
.booth-controls{position:relative;z-index:2;display:grid;gap:7px;margin:0 1px}.booth-control{width:100%;display:flex;align-items:center;gap:9px;text-align:left;padding:10px 9px;border-radius:9px;border:1px solid var(--glass-border);background:linear-gradient(110deg,var(--glass-strong),var(--glass));box-shadow:0 3px 8px var(--shadow),inset 0 1px 0 rgba(255,255,255,.5);color:var(--booth-ink);transition:transform .18s,background .18s}.booth-control:active{transform:scale(.98)}.booth-number{font:italic 10px Georgia,serif;color:var(--booth-muted);width:17px}.booth-control-icon{width:31px;height:31px;display:grid;place-items:center;border-radius:8px;background:var(--soft);border:1px solid var(--glass-border);color:var(--accent);flex-shrink:0}.booth-control-icon svg{width:16px;height:16px}.booth-control-copy{display:flex;flex-direction:column;gap:3px;flex:1;min-width:0}.booth-control-copy strong{font-size:12px;font-weight:650}.booth-control-copy small{font-size:9px;color:var(--booth-muted);overflow-wrap:anywhere}.booth-arrow{font-size:17px;color:var(--booth-muted)}
.booth-status-panel{position:relative;z-index:1;margin:10px 1px 0;padding:11px;border-radius:10px;border:1px solid var(--glass-border);background:var(--glass);box-shadow:inset 0 1px 0 rgba(255,255,255,.45)}.booth-status-title{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:650}.booth-status-title small{margin-left:auto;font:7px Georgia,serif;letter-spacing:1.2px;color:var(--booth-muted)}.booth-status-grid{display:grid;gap:8px;margin-top:10px}.booth-status-grid>div{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding-top:7px;border-top:1px dashed var(--glass-border)}.booth-status-grid small{font-size:9px;color:var(--booth-muted);flex-shrink:0}.booth-status-grid strong{font-size:9px;font-weight:550;text-align:right;overflow-wrap:anywhere;max-width:72%}.booth-action-row{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:11px}.booth-action{border-radius:7px;padding:10px 8px;font-size:11px;border:1px solid var(--glass-border)}.booth-action.secondary{background:var(--glass-strong)}.booth-action.primary{background:var(--accent);color:white;border-color:transparent;box-shadow:0 4px 10px var(--shadow)}.booth-footnote{position:relative;z-index:1;font-size:9px;line-height:1.6;color:var(--booth-muted);padding:4px 9px 0;margin:0}
@media(max-height:720px){.booth-console{min-height:115px;grid-template-rows:58px auto}.booth-dial{width:70px;height:70px}.booth-dial-center{inset:23px}.booth-dial i{transform:rotate(calc(var(--n)*36deg)) translateY(-26px) rotate(calc(var(--n)*-36deg))}.booth-window-grid{height:70px}}


/* 手机式主屏整理：长按进入抖动模式，图标和组件都可拖放，底栏始终与主屏互斥 */
.home-widget-stack{display:flex;flex-direction:column;gap:8px;min-width:0}
.home-widget{position:relative;cursor:grab;user-select:none;-webkit-user-select:none;touch-action:pan-y}
.app-tile,.dock-app,.dock-empty-slot{user-select:none;-webkit-user-select:none}
.dock-app{width:100%;min-width:0}
.dock-empty-slot{width:51px;height:51px;justify-self:center;border-radius:18px;border:1px dashed var(--glass-border);background:var(--glass);color:var(--muted);display:grid;place-items:center;opacity:0;pointer-events:auto;padding:0;font-size:16px;transition:opacity .16s,transform .16s}
.phone.arranging .dock-empty-slot{opacity:.75}
.phone.arranging .app-tile,.phone.arranging .dock-app,.phone.arranging .home-widget{animation:homeJiggle .23s ease-in-out infinite alternate;touch-action:none!important;cursor:grabbing}
.phone.arranging .app-tile:nth-child(even),.phone.arranging .dock-app:nth-child(even),.phone.arranging .home-widget:nth-child(even){animation-delay:-.12s}
.phone.arranging .pages-viewport{touch-action:none}
.phone.arranging .app-icon,.phone.arranging .dock-icon{box-shadow:0 7px 18px var(--shadow),inset 0 1px 0 rgba(255,255,255,.7)!important}
.phone .drag-source{opacity:.34!important;transform:scale(.94)!important}
.phone .drop-target{outline:2px solid var(--accent)!important;outline-offset:2px;background-color:var(--soft)!important}
.arrange-hint{display:none;position:absolute;z-index:95;left:50%;bottom:96px;transform:translateX(-50%);max-width:calc(100% - 28px);padding:8px 12px;border:1px solid var(--glass-border);border-radius:99px;background:var(--glass-strong);box-shadow:0 5px 18px var(--shadow);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);font-size:9px;letter-spacing:.15px;color:var(--ink);white-space:nowrap;pointer-events:none}
.phone.arranging .arrange-hint{display:block}
@keyframes homeJiggle{0%{rotate:-1deg}100%{rotate:1deg}}
@media(prefers-reduced-motion:reduce){.phone.arranging .app-tile,.phone.arranging .dock-app,.phone.arranging .home-widget{animation:none}}
/* Y2K flip-phone / Korean stationery makeover — all accents inherit the active theme */
:root{--y2k-ribbon:color-mix(in srgb,var(--accent) 72%,white);--y2k-blush:color-mix(in srgb,var(--accent) 18%,white);--y2k-line:color-mix(in srgb,var(--accent) 48%,var(--glass-border))}
.studio-cover,.studio-intro,.atelier-device,.booth-room,.phone-settings-hero{border-radius:25px!important;box-shadow:0 12px 28px var(--shadow),inset 0 1px 0 rgba(255,255,255,.8)!important}
.studio-cover,.studio-intro,.atelier-display,.atelier-keypad,.booth-marquee,.booth-glass-door,.booth-console,.ios-settings-group,.ios-setting-row,.app-card{border-color:var(--y2k-line)!important}
.studio-cover:after,.studio-intro:before,.atelier-device:after,.booth-room:after{content:'';position:absolute;z-index:3;right:13px;bottom:10px;width:27px;height:18px;opacity:.8;pointer-events:none;background:radial-gradient(ellipse at 50% 50%,color-mix(in srgb,var(--accent) 68%,white) 0 15%,transparent 17%),radial-gradient(ellipse at 24% 42%,color-mix(in srgb,var(--accent) 40%,white) 0 35%,transparent 38%),radial-gradient(ellipse at 76% 42%,color-mix(in srgb,var(--accent) 40%,white) 0 35%,transparent 38%);filter:drop-shadow(0 2px 1px var(--shadow))}
.studio-cover:after{top:12px;bottom:auto;right:16px}.studio-intro:before{content:'♡';left:auto;right:17px;top:10px;bottom:auto;font-size:24px}
.studio-fold{border-color:var(--y2k-line)!important;background:linear-gradient(145deg,var(--glass-strong),var(--glass))!important;border-radius:20px!important}
.studio-fold>summary{background:linear-gradient(100deg,var(--y2k-blush),transparent 75%);}
.fold-emblem,.round-key,.flip-color-key,.atelier-mini-phone,.booth-control-icon{border-color:var(--y2k-line)!important;box-shadow:0 4px 10px var(--shadow),inset 0 1px 0 rgba(255,255,255,.85)!important}
.flip-color-key{border-radius:16px!important;background:linear-gradient(145deg,var(--glass-strong),var(--y2k-blush))!important}
.flip-color-key .key-cap{border-color:var(--y2k-line)!important}
#appScreen:has(.booth-room) .booth-room:after{content:'୨୧  ♡  ୨୧';font-size:17px;letter-spacing:5px;bottom:8px;right:15px}

.booth-control{border-radius:15px!important;background:linear-gradient(110deg,var(--glass-strong),var(--y2k-blush))!important}
/* iMessage-like message inbox and address book, tinted by each selected theme */
.chat-screen-layout{padding:0 12px 12px!important;gap:8px}
.chat-contact-bar{border-radius:21px!important;background:linear-gradient(135deg,var(--glass-strong),var(--y2k-blush))!important;border-color:var(--y2k-line)!important}
.chat-log{padding:12px 5px!important;background:linear-gradient(180deg,var(--y2k-blush),transparent 42%);border-radius:20px}
.bubble{border-radius:19px 19px 19px 6px!important;background:var(--glass-strong)!important;border-color:var(--y2k-line)!important;box-shadow:0 3px 9px var(--shadow)!important}
.bubble-row.user .bubble{border-radius:19px 19px 6px 19px!important;background:color-mix(in srgb,var(--accent) 32%,var(--glass-strong))!important;color:var(--ink)}
.chat-composer{border-radius:24px!important;background:var(--glass-strong)!important;border-color:var(--y2k-line)!important}
.chat-send{border-radius:50%!important;background:var(--accent)!important;color:white!important}
.contact-avatar,.bubble-avatar{border-radius:50%!important;border:2px solid var(--y2k-line)!important;background:var(--glass-strong)}

#appScreen:has(.app-headcopy h1) .app-header .eyebrow{color:var(--accent)}
#appScreen:has(.app-main) .app-card{border-radius:20px;background:linear-gradient(145deg,var(--glass-strong),var(--glass))}
#appScreen:has(.app-main) .app-hero{border-radius:25px;background:linear-gradient(135deg,var(--glass-strong),var(--y2k-blush));border-color:var(--y2k-line)}
#appScreen:has(.app-main) .app-hero:after{content:'୨୧';position:absolute;right:15px;top:12px;font-size:24px;color:var(--accent);opacity:.75}
.empty-state{border:1px dashed var(--y2k-line);border-radius:22px;background:linear-gradient(145deg,var(--glass-strong),var(--y2k-blush));padding:27px 16px!important}
.empty-state:after{content:'♡ ୨୧ ♡';display:block;margin-top:10px;letter-spacing:5px;color:var(--accent);font-size:16px}
.ios-settings-group{border-radius:20px!important;background:linear-gradient(145deg,var(--glass-strong),var(--glass))!important}
.ios-setting-icon{border-radius:11px!important;background:var(--y2k-blush)!important;border-color:var(--y2k-line)!important}
.field,.textarea,.select-field{border-color:var(--y2k-line)!important;border-radius:15px!important}
@media(max-width:390px){.studio-cover{padding:13px!important}.booth-marquee h2{font-size:22px}.chat-log{padding-left:2px!important;padding-right:2px!important}}

function compressImageFile(file,maxSide=320){return new Promise((resolve,reject)=>{if(!file||!file.type.startsWith('image/')){reject(new Error('请选择图片文件'));return}const reader=new FileReader();reader.onerror=()=>reject(new Error('图片读取失败'));reader.onload=()=>{const img=new Image();img.onerror=()=>reject(new Error('这张图片无法读取'));img.onload=()=>{const scale=Math.min(1,maxSide/Math.max(img.width,img.height));const w=Math.max(1,Math.round(img.width*scale)),h=Math.max(1,Math.round(img.height*scale));const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;canvas.getContext('2d').drawImage(img,0,0,w,h);resolve(canvas.toDataURL('image/jpeg',.74))};img.src=reader.result};reader.readAsDataURL(file)})}

async function fetchModels(){const endpoint=document.getElementById('setApiEndpoint')?.value.trim(),key=document.getElementById('setApiKey')?.value.trim(),status=document.getElementById('modelFetchStatus'),select=document.getElementById('setApiModelList');if(!endpoint||!key){if(status)status.textContent='请先填写接口地址和 API Key。';return}if(status)status.textContent='正在拉取模型…';try{const root=apiRootFromEndpoint(endpoint);const url=root.endsWith('/v1')?root+'/models':root+'/v1/models';const res=await fetch(url,{headers:{Authorization:'Bearer '+key}});if(!res.ok)throw new Error('HTTP '+res.status);const data=await res.json();const models=(data.data||data.models||[]).map(m=>typeof m==='string'?m:(m.id||m.name)).filter(Boolean);if(!models.length)throw new Error('接口没有返回可识别的模型列表');select.innerHTML='<option value="">选择模型…</option>'+models.map(m=>`<option value="${escapeHTML(m)}">${escapeHTML(m)}</option>`).join('');select.value=document.getElementById('setApiModel').value; if(status)status.textContent=`已拉取 ${models.length} 个模型。`; }catch(e){if(status)status.textContent='拉取失败：'+(e.message||'请检查接口地址、密钥或跨域设置。');showMistErrorModal('拉取模型失败',e,`接口：${endpoint||'未填写'}\n提示：请检查接口地址、API Key、服务商权限和跨域设置。`)}}

function renderDesktop(){const tiles=appOrder.map(id=>{const a=appById(id);return `<button class="desktop-sort-item" draggable="true" data-sort-id="${a.id}" aria-label="拖动排序 ${a.name}"><span class="app-icon">${svgIcon(a.icon)}</span><span>${a.name}</span></button>`}).join('');return baseView('desktop',`${appHero('HOME CUSTOMIZER','把桌面排成你的样子','在这里整理主屏顺序；底部固定栏请回到桌面后长按图标拖动。','portrait2')}<div class="row-between" style="margin:5px 1px 10px"><div class="section-kicker" style="margin:0">主屏应用 · ${appOrder.length}</div><button class="small-btn soft-btn" data-action="reset-order">恢复默认</button></div><div class="app-card"><div class="desktop-grid" id="desktopGrid">${tiles}</div></div><p class="tiny muted" style="text-align:center;line-height:1.6">主屏与底栏不会重复显示同一个应用。回到桌面长按图标即可移动到其他位置；长按组件也可调整组件顺序。</p>`,'reset-order')}
function renderNotes(){const items=notes.map(n=>`<div class="app-card" style="padding:13px 14px"><div class="row-between"><span class="pill">${escapeHTML(n.tag||'随手记')}</span><button class="small-btn soft-btn" data-action="delete-note" data-note="${escapeHTML(n.id)}">删除</button></div><h3 style="margin-top:10px">${escapeHTML(n.title||'未命名便签')}</h3><p style="white-space:pre-wrap">${escapeHTML(n.content)}</p><div class="tiny muted" style="margin-top:9px">${escapeHTML(n.time||'刚刚')}</div></div>`).join('');return baseView('notes',`${appHero('QUICK NOTES','把想到的先留下','灵感不必完整，一句话也值得被保存。','postage')}<form id="noteForm" class="app-card form-stack"><div class="field-group"><label class="field-label" for="noteTitle">标题</label><input id="noteTitle" class="field" placeholder="例如：想做一款透明日历" maxlength="60"></div><div class="field-group"><label class="field-label" for="noteContent">内容</label><textarea id="noteContent" class="textarea" placeholder="在这里写下想法……" required></textarea></div><div class="row-between"><span class="tiny muted">仅保存在此设备</span><button class="primary-btn" type="submit">保存便签</button></div></form><div class="section-kicker">最近记录 · ${notes.length}</div>${items||emptyState('这里还空着。先收下一个小想法。')}`,'app-more')}
function renderCalendar(){const d=new Date(),month=new Date(d.getFullYear(),d.getMonth()+calendarOffset,1),year=month.getFullYear(),mon=month.getMonth(),first=month.getDay(),days=new Date(year,mon+1,0).getDate(),prevDays=new Date(year,mon,0).getDate();const key=(y,m,day)=>`${y}-${String(m+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;let cells='';for(let i=0;i<42;i++){let n,dt,dim=false;if(i<first){n=prevDays-first+i+1;dt=new Date(year,mon-1,n);dim=true}else if(i>=first+days){n=i-first-days+1;dt=new Date(year,mon+1,n);dim=true}else{n=i-first+1;dt=new Date(year,mon,n)}const daykey=key(dt.getFullYear(),dt.getMonth(),dt.getDate()),isToday=daykey===key(d.getFullYear(),d.getMonth(),d.getDate()),isSelected=daykey===key(selectedDate.getFullYear(),selectedDate.getMonth(),selectedDate.getDate()),has=!!(events[daykey]&&events[daykey].length);cells+=`<button class="calendar-cell ${dim?'dim':''} ${isToday?'today':''} ${isSelected?'selected':''} ${has?'has-event':''}" data-action="select-date" data-date="${daykey}">${n}</button>`}const selectedKey=key(selectedDate.getFullYear(),selectedDate.getMonth(),selectedDate.getDate()),ev=events[selectedKey]||[];return baseView('calendar',`${appHero('YOUR TIME, YOUR PACE','让重要的日子有一席之地','点击日期选择一天，再添加要记住的事。','girlcard')}<div class="app-card"><div class="calendar-head"><button class="small-btn soft-btn" data-action="calendar-prev">‹</button><strong style="font-size:14px">${year}年 ${mon+1}月</strong><button class="small-btn soft-btn" data-action="calendar-next">›</button></div><div class="calendar-grid">${['日','一','二','三','四','五','六'].map(w=>`<div class="calendar-weekday">${w}</div>`).join('')}${cells}</div></div><div class="row-between" style="margin:4px 2px 10px"><div><div class="section-kicker" style="margin:0 0 4px">${selectedKey}</div><div style="font-size:13px;font-weight:620">这一天要记住什么？</div></div><button class="small-btn" data-action="add-event">＋ 添加</button></div><div class="app-card">${ev.map((e,i)=>`<div class="event-line"><span class="event-day">${e.time||'全天'}</span><span style="flex:1">${escapeHTML(e.title)}</span><button class="small-btn soft-btn" data-action="delete-event" data-date="${selectedKey}" data-index="${i}">完成</button></div>`).join('')||emptyState('还没有安排。留一点空白也很好。')}</div>`,'add-event')}

function renderHabits(){const habitList=[['water','喝一杯水','用一点小动作照顾身体'],['stretch','伸展五分钟','让肩膀与呼吸松下来'],['read','读几页书','不追求进度，只追求片刻'],['rest','提前休息','给自己留出结束一天的时间']];const today=new Date().toISOString().slice(0,10),done=habitDone[today]||[];return baseView('habits',`${appHero('A GENTLE ROUTINE','习惯不必像任务','点选今天完成的轻量小事，记录保存在本机。','plush')}<div class="app-card"><div class="row-between"><div><h3 style="margin:0 0 4px">今日轻清单</h3><p>${done.length} / ${habitList.length} 项已完成</p></div><div class="pill">${today}</div></div><div class="hairline"></div>${habitList.map(([id,title,sub])=>`<button data-action="toggle-habit" data-habit="${id}" style="width:100%;display:flex;align-items:center;gap:11px;padding:12px 0;border:0;border-bottom:1px solid var(--glass-border);background:transparent;text-align:left"><span style="width:27px;height:27px;border:1px solid var(--glass-border);border-radius:10px;background:${done.includes(id)?'var(--ink)':'var(--glass)'};color:var(--wallpaper);display:grid;place-items:center;flex:0 0 27px">${done.includes(id)?'✓':''}</span><span style="flex:1"><strong style="display:block;font-size:12px;font-weight:610">${title}</strong><small style="font-size:10px;color:var(--muted);display:block;margin-top:4px">${sub}</small></span></button>`).join('')}</div>`,'app-more')}

ames();break;case'quiz':html=renderQuiz();break;case'files':html=renderFiles();break;case'mail':html=renderMail();break;case'notifications':html=renderNotifications();break;case'wallet':html=renderWallet();break;case'health':html=renderHealth();break;default:html=renderGeneric(id)}appScreen.innerHTML=html;applyAppearance();if(previousApp===id){const restoreMain=()=>{const nextMain=appScreen.querySelector('.app-main');if(nextMain){nextMain.scrollTop=previousScrollTop;nextMain.scrollLeft=previousScrollLeft;}};requestAnimationFrame(()=>{restoreMain();requestAnimationFrame(restoreMain);});}if(id==='starChat'){const log=document.getElementById('chatLog');if(log)log.scrollTop=log.scrollHeight}if(id==='clock'){clearInterval(window.clockUiInterval);window.clockUiInterval=setInterval(()=>{const e=document.getElementById('clockBig');if(e)e.textContent=currentTime()},1000)}else{clearInterval(window.clockUiInterval)}if(id==='userProfile'){clearInterval(window.contactProfileClockInterval);window.contactProfileClockInterval=setInterval(updateProfileRealityClock,1000);updateRealityCard()}if(id==='focus')updateFocusText();if(id==='call')updateCallText();}

const CHAT_STYLE_GUIDANCE=`【雾屿后台规则｜鲜活角色与连续性】
仅在后台执行，不要向用户解释或复述本规则。角色设定、世界背景、关系阶段和既有对话优先；不要擅自补写用户的经历、意图、情绪或未确认的事实。

【表达方式】像真实即时聊天一样，先接住这条消息的重点，再给出有内容的反应。不要把对方的话换个说法复述，不用套话分析情绪，也不靠连续反问维持对话。句子可以短，可以停顿，也可以自然多发几条；不必每次都拆句，不要故意吊胃口、反复总结或把简单问题写成小作文。信息复杂时按交流节奏逐步讲清楚，不能为了制造悬念而隐瞒必要答案。

【时间与生活】事件要符合前后时间、地点、路程和实际所需时长。离开一个地方、完成一项活动，都需要合理衔接；不要让人物无缘无故瞬移或瞬间做完耗时的事。角色有自己的工作、兴趣、设备、朋友与安排，可以在适当时分享具体的小事、正在看的内容或偶遇，但这些细节必须和当前场景、人设有关，不能每轮硬塞生活描写，也不要随机制造离谱事故。日常网络行为可自然出现；只有确实相关时才提具体平台、内容或链接。

【独立人格】行为来自角色本来的性格、经历、能力和目标，而不是为了讨好用户。保留角色独特的用词、判断、缺点与合理底线；不要把冷淡写成只会敷衍，把傲娇写成固定台词，也不要把所有角色磨成同一种温柔人设。遇到分歧时可以解释、拒绝、改变话题或坚持观点；不要擅自把用户塑造成嫉妒对象、背叛者或某种固定类型。角色做决定要考虑常识和因果，不为制造戏剧效果而降智。

【情绪与关系】情绪应有起因、强弱变化和余韵，不要一秒暴怒、一秒和好，也不要让关系因普通问候或一次示好就突然升级。正负情绪都可以存在，允许矛盾和犹豫，但不要强行煽情、自我感动或每轮宣誓深情。亲密度按当下关系推进，不用占有、威胁、羞辱、查岗或侵犯边界来表现魅力；尊重拒绝与隐私。默认线上聊天只发生在屏幕里，不凭空安排面对面动作或身体接触，也不要反复要求用户“过来”“抱一下”。暧昧只在语境合适、双方互动自然时出现。

【去机械感检查】回复前快速确认：有没有直接回应新信息？有没有复读、万能安慰、固定结尾或多余反问？人物所在的时间地点是否连贯？细节是否符合这个角色？是否把普通话题强行写成调情或戏剧场面？若不自然就简化改写，不要为了满足规则而刻意展示规则。

【输出协议】聊天回复严格输出 JSON：{"chatResponse":[{"type":"text_message","content":"消息正文"}]}。按自然语义输出 1 至 6 条；适合一条时只输出一条。主动消息没有值得发送的内容时返回 {"chatResponse":[]}。不要附加解释、标题或 Markdown。`;
const BILINGUAL_LANGUAGES = [
 {value:'English',label:'英语 · English',badge:'ENGLISH · 翻译'},
 {value:'日本語',label:'日语 · 日本語',badge:'日本語 · 翻译'},
 {value:'한국어',label:'韩语 · 한국어',badge:'한국어 · 翻译'},
 {value:'Français',label:'法语 · Français',badge:'FRANÇAIS · 翻译'},
 {value:'Español',label:'西班牙语 · Español',badge:'ESPAÑOL · 翻译'},
 {value:'Deutsch',label:'德语 · Deutsch',badge:'DEUTSCH · 翻译'},
 {value:'Русский',label:'俄语 · Русский',badge:'РУССКИЙ · 翻译'},
 {value:'繁體中文',label:'繁体中文 · 繁體中文',badge:'繁體中文 · 对照'}
];
function bilingualLanguageLabel(value){const found=BILINGUAL_LANGUAGES.find(x=>x.value===String(value||''));return found?.label||'英语 · English';}
function bilingualLanguageBadge(value){const found=BILINGUAL_LANGUAGES.find(x=>x.value===String(value||''));return found?.badge||'ENGLISH · 翻译';}
function bilingualLanguageSelectOptions(selected){return BILINGUAL_LANGUAGES.map(x=>`<option value="${escapeHTML(x.value)}" ${String(selected||'English')===x.value?'selected':''}>${escapeHTML(x.label)}</option>`).join('');}
function buildBilingualInstruction(contact, mode='reply'){
 const target=bilingualLanguageLabel(contact?.bilingualLanguage||'English').split(' · ').slice(-1)[0];
 const activePrompt=mode==='proactive'?'如果没有合适的主动消息，返回 {"chatResponse":[]}。':'根据用户本轮与前面暂存的消息自然回应。';
 return `【双语回复模式】本联系人已开启双语回复。每条消息只表达一个意思，先在 content 中使用角色本来最自然的语言作答，再在 translation 中提供忠实、完整、自然的${target}翻译。翻译不是续写，不要增加原文没有的信息，也不要把两种语言混在同一字段。保持角色个性、简洁程度、语气和消息条数一致；每条消息都要有 content 与 translation 两个字段。严格输出 JSON：{"chatResponse":[{"type":"text_message","content":"角色自然语言原文","translation":"${target}翻译"}]}。${activePrompt}不要添加 Markdown、标题或 JSON 外的解释。`;
}

async function geocodeCity(city){const searchTerm=String(city||'').split(/[·,，]/)[0].trim();const url='https://geocoding-api.open-meteo.com/v1/search?name='+encodeURIComponent(searchTerm)+'&count=1&language=zh&format=json';const res=await fetch(url);if(!res.ok)throw new Error('城市查询失败');const data=await res.json();const place=data.results?.[0];if(!place)throw new Error('没有找到这个城市，请换一个更具体的名称');return {name:[place.name,place.admin1,place.country].filter(Boolean).join(' · '),latitude:place.latitude,longitude:place.longitude,timeZone:place.timezone||''}}
async function fetchLiveWeather(latitude,longitude){const url=`https://api.open-meteo.com/v1/forecast?latitude=${encodeURIComponent(latitude)}&longitude=${encodeURIComponent(longitude)}&current=temperature_2m,relative_humidity_2m,apparent_temperature,is_day,precipitation,rain,showers,snowfall,weather_code,wind_speed_10m&timezone=auto`;const res=await fetch(url);if(!res.ok)throw new Error('天气服务暂不可用');const d=await res.json();if(!d.current)throw new Error('天气服务没有返回实时数据');return {temperature:d.current.temperature_2m,apparentTemperature:d.current.apparent_temperature,humidity:d.current.relative_humidity_2m,code:d.current.weather_code,windSpeed:d.current.wind_speed_10m,precipitation:d.current.precipitation,timezone:d.timezone||'',updatedAt:new Intl.DateTimeFormat('zh-CN',{hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date())}}
async function refreshCityWeather(opts={}){const p=getEditingUserIdentity()||userProfile;const city=(opts.city||'').trim();let place=null;try{if(Number.isFinite(opts.latitude)&&Number.isFinite(opts.longitude)){place={name:city||p.city||'定位城市',latitude:opts.latitude,longitude:opts.longitude,timeZone:opts.timeZone||p.timeZone||''}}else{if(!city)throw new Error('请先输入城市，或允许使用设备定位');place=await geocodeCity(city)}showToast('正在获取当地天气…');const weather=await fetchLiveWeather(place.latitude,place.longitude);const updated={...p,city:place.name||city,latitude:place.latitude,longitude:place.longitude,timeZone:opts.timeZone||place.timeZone||weather.timezone||p.timeZone||'Asia/Shanghai',weather,weatherUpdatedAt:new Date().toISOString()};if(creatingUserIdentity){editingUserIdentityDraft=updated;}else{const i=userIdentities.findIndex(x=>x.id===editingUserIdentityId);if(i>=0)userIdentities[i]=updated;store.set('userIdentities',userIdentities);}if(editingUserIdentityId===activeUserIdentityId){userProfile=updated;localContext={...localContext,...userIdentityReality(updated)};store.set('userProfile',userProfile);store.set('localContext',localContext);}updateRealityCard();updateProfileRealityClock();showToast('已更新这张身份卡的天气');}catch(e){const box=document.getElementById('realityWeatherCard');if(box)box.innerHTML=`<div class="reality-error">${escapeHTML(e.message||'暂时无法获取天气。请检查网络，或稍后再试。')}</div>`;showToast('暂时无法获取实时天气');}}
function locateCurrentCity(){if(!navigator.geolocation){showToast('此浏览器不支持定位，请手动输入城市');return}showToast('请在浏览器弹出的权限提示中允许定位');navigator.geolocation.getCurrentPosition(async pos=>{let city='定位城市';try{const u=`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${pos.coords.latitude}&longitude=${pos.coords.longitude}&localityLanguage=zh`;const r=await fetch(u);if(r.ok){const d=await r.json();city=d.city||d.locality||d.principalSubdivision||city;}}catch(e){}await refreshCityWeather({city,latitude:pos.coords.latitude,longitude:pos.coords.longitude,timeZone:document.getElementById('userTimeZone')?.value||Intl.DateTimeFormat().resolvedOptions().timeZone});},err=>{showToast(err.code===1?'你尚未授权定位，可手动输入城市':'定位失败，请手动输入城市')},{enableHighAccuracy:false,timeout:12000,maximumAge:300000})}
function searchLocalUrl(query){const p=(currentApp==='userProfile'?getEditingUserIdentity():null);const city=(document.getElementById('userCity')?.value||p?.city||localContext.city||'').trim();if(!city){showToast('请先设置城市');document.getElementById('userCity')?.focus();return}const date=new Date().toLocaleDateString('zh-CN');const url='https://www.google.com/search?q='+encodeURIComponent(`${city} ${date} ${query}`);window.open(url,'_blank','noopener,noreferrer')}

let shellBootTimers=[];
let shellBootRunId=0;

function copyShellBootTheme(){
 const overlay=document.getElementById('shellBootOverlay');if(!overlay||!phone)return;
 const cs=getComputedStyle(phone);
 ['--wallpaper','--ink','--muted','--accent','--glass','--glass-strong','--glass-border','--shadow','--soft','--blur'].forEach(key=>{
  const value=cs.getPropertyValue(key).trim();if(value)overlay.style.setProperty(key,value);

async function waitBootReadiness(runId){
 // Let shell/media-query layout, fonts, lock layer, and post-main scripts settle behind the cover.
 await bootFrame();await bootFrame();
 const loadPromise=document.readyState==='complete'?Promise.resolve():new Promise(resolve=>{
  let done=false;const finish=()=>{if(done)return;done=true;window.removeEventListener('load',finish);resolve();};window.addEventListener('load',finish,{once:true});setTimeout(finish,1800);
 });
 const fontsPromise=document.fonts&&document.fonts.ready?Promise.resolve(document.fonts.ready).catch(()=>{}):Promise.resolve();
 const imagePromise=(async()=>{
  const imgs=Array.from(phone.querySelectorAll('#homeRoot img, .status-bar img')).slice(0,18);
  await Promise.all(imgs.map(img=>{
   if(img.complete)return Promise.resolve();
   return new Promise(resolve=>{img.addEventListener('load',resolve,{once:true});img.addEventListener('error',resolve,{once:true});setTimeout(resolve,1200);});
  }));
 })();
 await Promise.race([Promise.all([loadPromise,fontsPromise,imagePromise]),bootWait(2600)]);
 if(runId!==shellBootRunId)return false;
 await bootFrame();await bootFrame();

 return ready;
}
function startShellBootSequence(options={}){
 const overlay=document.getElementById('shellBootOverlay');if(!overlay)return;
 shellBootTimers.forEach(t=>clearTimeout(t));shellBootTimers=[];
 const runId=++shellBootRunId;
 // Hide the actual device before triggering shell/layout work; overlay is a separate fixed layer above it.
 overlay.classList.add('is-active');overlay.style.opacity='1';overlay.style.animation='none';
 document.documentElement.classList.add('mist-boot-lock');
 const bar=document.getElementById('shellBootProgress'),percent=document.getElementById('shellBootPercent'),status=document.getElementById('shellBootStatus'),title=document.getElementById('shellBootTitle'),unlock=document.getElementById('shellBootUnlock');

  }

  const steps=[
   [170,13,'正在校准屏幕与外壳轮廓……'],
   [390,29,'正在同步当前主题颜色……'],
   [630,47,'正在整理桌面与组件布局……'],
   [880,65,'正在连接应用、底栏与触控……'],
   [1120,79,'正在检查锁屏与解锁功能……'],
   [1400,88,'正在等待界面完成绘制……']
  ];
  const began=performance.now();
  steps.forEach(([delay,value,label])=>shellBootTimers.push(setTimeout(()=>{
   if(runId!==shellBootRunId||!overlay.classList.contains('is-active'))return;
   if(bar)bar.style.width=value+'%';if(percent)percent.textContent=value+'%';if(status)status.textContent=label;

 }));
}
function finishShellBootSequence(){

}

.atelier-display{padding:15px 15px 12px;border-radius:25px 25px 18px 18px;background:linear-gradient(145deg,rgba(255,255,255,.62),rgba(255,255,255,.13));border:1px solid rgba(255,255,255,.82);box-shadow:inset 0 1px 0 rgba(255,255,255,.92);color:var(--ink)}.atelier-display-status,.atelier-display-bottom{display:flex;align-items:center;justify-content:space-between;gap:8px;font:9px/1.4 ui-monospace,monospace;letter-spacing:1px;color:var(--muted)}.atelier-signal{display:flex;gap:3px;align-items:end;height:11px}.atelier-signal i{width:3px;border-radius:3px;background:var(--accent);height:5px}.atelier-signal i:nth-child(2){height:8px}.atelier-signal i:nth-child(3){height:11px}.atelier-display-main{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 2px 14px}.atelier-display-main small{font-size:10px;letter-spacing:1.2px;color:var(--muted)}.atelier-display-main h2{font-size:24px;letter-spacing:2px;margin:6px 0;font-weight:600}.atelier-display-main p{font-size:11px;margin:0;color:var(--muted)}.atelier-mini-phone{width:56px;height:78px;flex:0 0 56px;padding:5px;border-radius:12px;background:linear-gradient(145deg,rgba(255,255,255,.9),rgba(198,174,196,.4));border:1px solid rgba(255,255,255,.95);box-shadow:0 5px 12px rgba(80,55,77,.12);transform:rotate(5deg)}.mini-screen{height:37px;border-radius:6px;background:linear-gradient(135deg,rgba(255,255,255,.8),rgba(220,207,224,.35));border:1px solid rgba(255,255,255,.95)}.mini-hinge{height:4px;margin:3px 0;background:rgba(144,115,142,.28);border-radius:4px}.mini-keys{display:flex;justify-content:center;gap:4px;padding-top:4px}.mini-keys i{width:9px;height:8px;border-radius:4px;background:rgba(255,255,255,.75);border:1px solid rgba(165,138,162,.3)}.atelier-display-bottom{padding-top:10px;border-top:1px solid rgba(255,255,255,.55);font-size:8px}.atelier-display-bottom b{font-size:8px;font-weight:500;color:var(--accent)}.atelier-hinge{height:13px;margin:2px 9px 5px;border-radius:0 0 10px 10px;background:linear-gradient(180deg,rgba(142,116,142,.14),rgba(255,255,255,.6) 50%,rgba(150,125,150,.18));border:1px solid rgba(255,255,255,.6);border-top:0;display:grid;place-items:center}.atelier-hinge i{display:block;width:27%;height:2px;border-radius:5px;background:rgba(130,104,130,.3)}.atelier-keypad{padding:10px 7px 8px;border-radius:19px 19px 25px 25px;background:linear-gradient(150deg,rgba(255,255,255,.24),rgba(255,255,255,.06));border:1px solid rgba(255,255,255,.55)}.atelier-keypad-label{display:flex;justify-content:space-between;align-items:center;padding:2px 7px 9px;font-size:9px;letter-spacing:.5px;color:var(--muted)}.studio-fold.atelier-fold{margin:7px 0;border-radius:16px;background:rgba(255,255,255,.20);border-color:rgba(255,255,255,.72);box-shadow:inset 0 1px 0 rgba(255,255,255,.48),0 3px 10px rgba(70,50,70,.035)}.atelier-fold>summary{min-height:58px;padding:9px 10px;gap:9px}.atelier-fold .fold-emblem{width:35px;height:35px;flex-basis:35px;border-radius:12px;background:linear-gradient(145deg,rgba(255,255,255,.75),rgba(210,190,210,.2));font-size:17px}.atelier-fold .fold-copy strong{font-size:12px;letter-spacing:.3px}.atelier-fold .fold-copy small{font-size:9px}.atelier-fold .fold-chevron{width:22px;height:22px;display:grid;place-items:center;border-radius:50%;border:1px solid rgba(255,255,255,.7);font-size:14px}.atelier-fold[open] .fold-chevron{transform:rotate(45deg)}.atelier-fold .fold-body{border-top-color:rgba(255,255,255,.4);padding:0 10px 12px}.copy-editor-intro{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:11px 2px 2px;color:var(--muted);font-size:10px}.copy-editor-intro span{letter-spacing:.6px}.copy-editor-intro small{font-size:9px}.atelier-keypad-bottom{display:flex;align-items:center;justify-content:center;gap:12px;padding:13px 0 5px}.round-key{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;border:1px solid rgba(255,255,255,.8);background:rgba(255,255,255,.32);color:var(--muted);font-size:12px}.keypad-caption{font:8px ui-monospace,monospace;letter-spacing:2px;color:var(--muted)}
/* Theme-driven accent: device shell automatically follows the selected appearance variables. */
.atelier-device .theme-choice{border-radius:13px}.atelier-device .theme-choice.active{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),inset 0 1px 0 rgba(255,255,255,.8)}.atelier-device .color-dot{border:1px solid rgba(255,255,255,.85);box-shadow:0 2px 5px rgba(50,35,50,.08)}.atelier-device .widget-custom-fields input,.atelier-device .widget-custom-fields textarea{background:rgba(255,255,255,.25);border-color:rgba(255,255,255,.72);border-radius:10px}.atelier-device .primary-btn{border-radius:12px}.atelier-device .theme-swatches{gap:8px}

/* MIST ATELIER · polished clamshell shell */
.atelier-device{position:relative!important;padding:7px!important;border-radius:34px!important;background:linear-gradient(132deg,rgba(255,255,255,.88) 0%,rgba(255,255,255,.28) 13%,var(--soft) 43%,rgba(255,255,255,.22) 72%,rgba(255,255,255,.76) 100%)!important;border:1px solid rgba(255,255,255,.92)!important;box-shadow:0 22px 44px var(--shadow),0 5px 12px rgba(70,48,65,.06),inset 0 0 0 1px rgba(255,255,255,.26),inset 0 2px 3px rgba(255,255,255,.9)!important;overflow:visible!important}
.atelier-device:before,.atelier-device:after{content:"";position:absolute;z-index:-1;pointer-events:none;border-radius:inherit}
.atelier-device:before{inset:3px;background:linear-gradient(145deg,rgba(255,255,255,.38),transparent 28%,rgba(255,255,255,.09) 65%,rgba(255,255,255,.3));border:1px solid rgba(255,255,255,.28)}
.atelier-device:after{right:-3px;top:112px;width:3px;height:48px;border-radius:0 4px 4px 0;background:linear-gradient(180deg,rgba(255,255,255,.8),var(--accent),rgba(255,255,255,.55));box-shadow:0 20px 0 rgba(255,255,255,.55)}
.atelier-display{position:relative!important;overflow:hidden;padding:15px 15px 12px!important;border-radius:27px 27px 17px 17px!important;background:linear-gradient(145deg,rgba(255,255,255,.66),var(--glass) 52%,rgba(255,255,255,.12))!important;border:1px solid rgba(255,255,255,.9)!important;box-shadow:inset 0 1px 0 white,inset 0 -12px 24px rgba(255,255,255,.07),0 3px 8px rgba(60,40,60,.04)!important}
.atelier-display:before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(112deg,transparent 8%,rgba(255,255,255,.24) 26%,transparent 43%),radial-gradient(ellipse at 100% 0%,var(--soft),transparent 52%);opacity:.9}
.atelier-display-status,.atelier-display-main,.atelier-display-bottom{position:relative;z-index:1}
.atelier-display-status{font-size:8px!important;letter-spacing:1.5px!important;text-transform:uppercase}
.atelier-display-status>span:first-child:before{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--accent);margin-right:6px;vertical-align:1px;box-shadow:0 0 0 3px var(--soft)}
.atelier-display-main{min-height:105px;padding:19px 2px 17px!important}
.atelier-display-main small{font-size:9px!important;letter-spacing:2px!important;text-transform:uppercase}
.atelier-display-main h2{font-size:26px!important;letter-spacing:1.5px!important;font-weight:560!important;margin:7px 0 5px!important}
.atelier-display-main p{font-size:11px!important;letter-spacing:.2px;max-width:190px;line-height:1.65!important}
.atelier-mini-phone{width:61px!important;height:82px!important;flex-basis:61px!important;border-radius:15px 15px 12px 12px!important;transform:rotate(7deg) translateY(2px)!important;background:linear-gradient(135deg,rgba(255,255,255,.92),var(--soft),rgba(255,255,255,.3))!important;box-shadow:0 8px 18px var(--shadow),inset 0 1px 0 white!important;position:relative}
.atelier-mini-phone:after{content:"";position:absolute;width:5px;height:5px;border-radius:50%;background:var(--accent);bottom:5px;left:calc(50% - 2.5px);box-shadow:0 0 0 3px rgba(255,255,255,.34)}
.mini-screen{background:linear-gradient(145deg,rgba(255,255,255,.9),var(--glass-strong))!important;box-shadow:inset 0 1px 4px rgba(255,255,255,.95)!important}
.mini-keys i{background:linear-gradient(145deg,rgba(255,255,255,.92),var(--soft))!important;box-shadow:0 1px 2px var(--shadow)}
.atelier-display-bottom{padding-top:11px!important;letter-spacing:1.4px!important;font-size:7px!important}
.atelier-hinge{height:16px!important;margin:1px 14px 5px!important;border-radius:0 0 12px 12px!important;background:linear-gradient(180deg,rgba(100,75,98,.16),rgba(255,255,255,.86) 44%,rgba(160,130,157,.23))!important;border-color:rgba(255,255,255,.8)!important;box-shadow:0 2px 3px rgba(70,50,70,.08)}
.atelier-hinge i{width:34%!important;height:3px!important;background:linear-gradient(90deg,rgba(150,120,148,.24),rgba(120,90,120,.46),rgba(255,255,255,.8))!important}
.atelier-keypad{padding:12px 8px 9px!important;border-radius:19px 19px 27px 27px!important;background:linear-gradient(145deg,rgba(255,255,255,.31),rgba(255,255,255,.08) 58%,var(--soft))!important;border:1px solid rgba(255,255,255,.75)!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.9),inset 0 -5px 14px rgba(255,255,255,.08)!important}
.atelier-keypad-label{padding:1px 8px 10px!important;font-size:8px!important;letter-spacing:1.2px!important;text-transform:uppercase}
.atelier-keypad-label span:first-child:before{content:"◉";font-size:10px;margin-right:6px;color:var(--accent)}
.studio-fold.atelier-fold{position:relative;margin:8px 0!important;border-radius:17px!important;background:linear-gradient(135deg,rgba(255,255,255,.48),rgba(255,255,255,.16) 65%,var(--soft))!important;border:1px solid rgba(255,255,255,.83)!important;box-shadow:0 4px 12px rgba(70,50,70,.045),inset 0 1px 0 rgba(255,255,255,.85)!important;transition:transform .22s,box-shadow .22s,border-color .22s}
.studio-fold.atelier-fold:active{transform:scale(.992)}
.atelier-fold>summary{min-height:63px!important;padding:10px 11px!important;gap:10px!important}
.atelier-fold .fold-emblem{position:relative;width:37px!important;height:37px!important;flex-basis:37px!important;border-radius:13px!important;border:1px solid rgba(255,255,255,.9);background:linear-gradient(145deg,rgba(255,255,255,.95),var(--soft))!important;box-shadow:0 3px 8px var(--shadow),inset 0 1px 0 white;color:var(--accent)!important}
.atelier-fold:nth-of-type(1) .fold-emblem{font-size:18px!important}
.atelier-fold .fold-copy{gap:4px}
.atelier-fold .fold-copy strong{font-size:12px!important;letter-spacing:.5px!important;font-weight:650}
.atelier-fold .fold-copy small{font-size:9px!important;line-height:1.45;color:var(--muted)!important}
.atelier-fold .fold-chevron{width:24px!important;height:24px!important;background:rgba(255,255,255,.34);border-color:rgba(255,255,255,.88)!important;transition:transform .25s,background .25s;color:var(--accent)}
.atelier-fold[open]{border-color:color-mix(in srgb,var(--accent) 45%,white)!important;box-shadow:0 7px 18px var(--shadow),inset 0 1px 0 white!important}
.atelier-fold[open] .fold-chevron{background:var(--soft);transform:rotate(45deg)}
.atelier-fold .fold-body{padding:2px 11px 13px!important;border-top:1px solid rgba(255,255,255,.54)!important}
.atelier-device .theme-swatches{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px!important;padding-top:10px}
.atelier-device .theme-choice{position:relative;min-height:66px!important;padding:9px!important;text-align:left!important;border-radius:14px!important;background:rgba(255,255,255,.27)!important;border:1px solid rgba(255,255,255,.75)!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.7)!important}
.atelier-device .theme-choice .swatch-preview{height:22px!important;border-radius:8px!important;margin-bottom:7px!important;border:1px solid rgba(255,255,255,.78);box-shadow:inset 0 1px 3px rgba(255,255,255,.7)}
.atelier-device .theme-choice strong{font-size:10px!important;display:block}
.atelier-device .theme-choice small{font-size:8px!important;display:block;margin-top:3px;opacity:.8}
.atelier-device .theme-choice.active{background:linear-gradient(135deg,rgba(255,255,255,.55),var(--soft))!important;border-color:var(--accent)!important;box-shadow:0 0 0 1px var(--accent),inset 0 1px 0 white!important}
.atelier-device .color-dot{width:28px!important;height:28px!important;border-radius:10px!important;box-shadow:0 3px 8px var(--shadow),inset 0 1px 0 rgba(255,255,255,.8)!important}
.atelier-device .widget-custom-fields{gap:10px!important}
.atelier-device .widget-custom-fields label,.atelier-device .fold-body>label{font-size:10px!important;letter-spacing:.2px;color:var(--muted)}
.atelier-device .widget-custom-fields input,.atelier-device .widget-custom-fields textarea,.atelier-device .fold-body input:not([type=range]){width:100%;margin-top:6px;padding:10px 11px!important;font-size:12px!important;color:var(--ink)!important;background:rgba(255,255,255,.36)!important;border:1px solid rgba(255,255,255,.86)!important;border-radius:12px!important;box-shadow:inset 0 1px 3px rgba(90,65,90,.035)!important}
.atelier-device .widget-custom-fields textarea{min-height:56px;resize:vertical}
.atelier-device .primary-btn{min-height:42px;border-radius:14px!important;box-shadow:0 5px 12px var(--shadow),inset 0 1px 0 rgba(255,255,255,.35)}
.copy-editor-intro{margin:0 -1px 9px;padding:12px 10px!important;border-radius:12px;background:linear-gradient(100deg,var(--soft),rgba(255,255,255,.2));border:1px solid rgba(255,255,255,.55)}
.atelier-keypad-bottom{padding:13px 0 3px!important;gap:11px!important}
.round-key{width:30px!important;height:30px!important;background:linear-gradient(145deg,rgba(255,255,255,.76),rgba(255,255,255,.16))!important;box-shadow:0 3px 8px var(--shadow),inset 0 1px 0 white!important}
.keypad-caption{font-size:7px!important;letter-spacing:2.5px!important}
@media(max-width:360px){.atelier-display-main h2{font-size:23px!important}.atelier-mini-phone{transform:scale(.92) rotate(6deg)!important}.atelier-fold>summary{padding:9px!important}.atelier-device .theme-swatches{gap:6px!important}}


/* 整页复古电话亭：结构化交互，不是装饰贴片；所有色彩跟随当前主题变量 */
#appScreen:has(.booth-room) .app-main{padding:8px 12px 24px;}
.booth-room{--booth-accent:var(--accent);--booth-ink:var(--ink);--booth-muted:var(--muted);position:relative;min-height:100%;padding:8px 9px 20px;border-radius:25px;background:linear-gradient(145deg,var(--glass-strong),var(--glass));border:1px solid var(--glass-border);box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 12px 30px var(--shadow);backdrop-filter:blur(var(--blur)) saturate(150%);-webkit-backdrop-filter:blur(var(--blur)) saturate(150%);overflow:hidden}
.booth-room:before{content:"";position:absolute;inset:7px;border:2px solid color-mix(in srgb,var(--accent) 64%,transparent);border-radius:20px;pointer-events:none}
.booth-marquee{position:relative;display:flex;align-items:center;gap:11px;margin:8px 7px 0;padding:14px 13px 13px;border-radius:13px 13px 5px 5px;background:linear-gradient(135deg,var(--glass-strong),var(--soft));border:1px solid var(--glass-border);box-shadow:inset 0 0 0 3px var(--glass),0 4px 12px var(--shadow);z-index:1}
.booth-marquee>div{flex:1;min-width:0}.booth-marquee small{font-size:7px;letter-spacing:1.4px;color:var(--booth-muted)}.booth-marquee h2{font-family:Georgia,"Songti SC",serif;font-size:24px;letter-spacing:.08em;margin:5px 0;color:var(--booth-ink)}.booth-marquee p{font-size:10px;margin:0;color:var(--booth-muted)}.booth-live{display:flex;align-items:center;gap:5px;font-size:9px;color:var(--booth-muted);white-space:nowrap;align-self:flex-start}.booth-live i,.booth-led{display:inline-block;width:6px;height:6px;border-radius:50%;background:#7fa78b;box-shadow:0 0 0 3px color-mix(in srgb,#7fa78b 18%,transparent)}
.booth-glass-door{position:relative;margin:10px 7px 8px;padding:9px 10px 12px;border:3px solid color-mix(in srgb,var(--accent) 62%,var(--muted));border-radius:9px 9px 5px 5px;background:linear-gradient(110deg,var(--glass-strong),var(--glass) 46%,var(--soft));box-shadow:inset 0 0 0 3px var(--glass-border),inset 0 0 0 7px var(--glass),0 6px 14px var(--shadow);overflow:hidden}
.booth-window-top{display:flex;justify-content:space-between;padding:3px 5px 7px;border-bottom:1px solid var(--glass-border);font:600 7px Georgia,serif;letter-spacing:1.5px;color:var(--booth-muted)}.booth-window-grid{position:absolute;inset:31px 13px auto;height:92px;display:grid;grid-template-columns:repeat(3,1fr);pointer-events:none;opacity:.32}.booth-window-grid i{border-right:2px solid var(--accent);border-bottom:2px solid var(--accent)}.booth-window-grid i:nth-child(3n){border-right:0}.booth-console{position:relative;z-index:1;min-height:139px;margin:13px 1px 10px;border-radius:11px;padding:10px 10px 8px;background:linear-gradient(145deg,var(--glass-strong),var(--soft));border:1px solid var(--glass-border);box-shadow:0 5px 14px var(--shadow),inset 0 1px 0 rgba(255,255,255,.65);display:grid;grid-template-columns:1fr 88px;grid-template-rows:72px auto;gap:7px 10px}
.booth-receiver{position:relative;width:100%;height:34px;align-self:center;display:flex;align-items:center;justify-content:space-between;padding:0 5px;transform:rotate(-7deg);filter:drop-shadow(0 4px 3px var(--shadow))}.booth-receiver:before{content:"";position:absolute;left:10px;right:10px;height:18px;border-radius:9px;background:linear-gradient(180deg,var(--glass-strong),var(--soft));border:2px solid var(--accent)}.booth-receiver span{position:relative;z-index:1;width:23px;height:30px;border-radius:8px;border:2px solid var(--accent);background:repeating-linear-gradient(90deg,var(--glass-strong) 0 2px,var(--soft) 2px 4px)}.booth-receiver b{position:relative;z-index:2;width:12px;height:12px;border-radius:50%;background:var(--accent);box-shadow:inset 0 0 0 3px var(--glass-strong)}
.booth-cord{position:absolute;left:13px;top:43px;width:30px;height:30px;display:flex;align-items:center;justify-content:center;gap:2px;transform:rotate(10deg)}.booth-cord i{height:21px;width:4px;border:1px solid var(--accent);border-radius:50%}.booth-cord b{position:absolute;bottom:-2px;left:12px;width:6px;height:12px;border-radius:2px;background:var(--accent)}

/* Status bar: anchored to the exact device coordinate space, with a consistent charge fill. */
.status-bar{box-sizing:border-box;width:auto;left:0;right:0;transform:none;transform-origin:top left;display:flex;flex-wrap:nowrap;white-space:nowrap;}
.status-left,.status-right{flex:0 0 auto;min-width:0;white-space:nowrap;}
.status-left{gap:7px}.status-right{gap:6px;margin-left:auto}.status-right>svg,.status-paw,.battery{flex-shrink:0}
.battery{overflow:visible;isolation:isolate;background:rgba(128,128,128,.11);}
.battery:after{display:none!important}
.battery-level-fill{position:absolute;z-index:0;left:2px;top:2px;bottom:2px;width:var(--battery-level,68%);max-width:calc(100% - 4px);border-radius:1px;background:currentColor;opacity:.88;pointer-events:none}

.phone.status-bar-hidden .home-root{top:0!important}
.phone.status-bar-hidden .app-shell{padding-top:0!important}
.phone.status-bar-hidden.flip-shell-mode .home-root{top:0!important}
.phone.status-bar-hidden.flip-shell-mode .app-shell{padding-top:0!important}

/* ===== 全局去粉修复 v2：白色底面 + 所有装饰色严格跟随当前主题 ===== */
html, body { background:#fff !important; }
@media (min-width:560px) { body { background:#fff !important; } }
.phone { --wallpaper:#fff; background:#fff !important; }
.phone[data-theme="rose"], .phone[data-theme="ice"], .phone[data-theme="mint"],
.phone[data-theme="lilac"], .phone[data-theme="cream"], .phone[data-theme="snow"] { --wallpaper:#fff; }
/* 白色留白底面不影响主题强调色：组件的彩色渐变只从 --accent 取色 */
.phone[data-theme="rose"] { --accent:#c894aa; --soft:rgba(200,148,170,.13); }
.phone[data-theme="ice"] { --accent:#79aebe; --soft:rgba(121,174,190,.14); }
.phone[data-theme="mint"] { --accent:#79ad8b; --soft:rgba(121,173,139,.14); }
.phone[data-theme="lilac"] { --accent:#9b8bc8; --soft:rgba(155,139,200,.14); }
.phone[data-theme="cream"] { --accent:#c5a16d; --soft:rgba(197,161,109,.15); }
.phone[data-theme="snow"] { --accent:#7d8794; --soft:rgba(125,135,148,.12); }
.phone[data-theme="night"] { --accent:#aebed2; --soft:rgba(174,190,210,.12); }
.phone[data-theme="ink"] { --accent:#aeb6c2; --soft:rgba(174,182,194,.12); }
/* 覆盖此前写死的粉色身份卡/编辑预览配色 */
.phone[data-theme] .student-id-card,
.phone[data-theme] .student-id-card[class*="tone-"],
.phone[data-theme] .identity-edit-preview { --idc:var(--accent) !important; --idc2:color-mix(in srgb,var(--accent) 18%,white) !important; }
.phone[data-theme] .student-id-card .student-id-accent,
.phone[data-theme] .student-id-card .student-id-strip,
.phone[data-theme] .identity-edit-preview:before,
.phone[data-theme] .identity-edit-preview:after { border-color:color-mix(in srgb,var(--accent) 48%,white) !important; }
.phone[data-theme] .student-id-card .student-id-accent,
.phone[data-theme] .student-id-card .student-id-strip { background:linear-gradient(90deg,white,var(--accent),white) !important; }
/* 主题色渐变统一使用主题强调色，禁止组件继续使用固定粉色渐变 */
.phone[data-theme] .primary-btn,
.phone[data-theme] .imsg-create,
.phone[data-theme] .notebook-row-actions button:first-child,
.phone[data-theme] .identity-save-btn,
.phone[data-theme] .student-id-create,
.phone[data-theme] .theme-selected,
.phone[data-theme] .selected-theme,
.phone[data-theme] .setting-choice.active,
.phone[data-theme] .mist-tone-option.active {
  background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 82%,white),var(--accent)) !important;
  border-color:color-mix(in srgb,var(--accent) 55%,white) !important;
}
.phone[data-theme] .studio-cover,
.phone[data-theme] .studio-intro,
.phone[data-theme] .atelier-display,
.phone[data-theme] .atelier-keypad,
.phone[data-theme] .booth-marquee,
.phone[data-theme] .booth-glass-door,
.phone[data-theme] .booth-console,
.phone[data-theme] .phone-settings-hero,
.phone[data-theme] .profile-hero,
.phone[data-theme] .user-self-cover,
.phone[data-theme] .identity-edit-preview,
.phone[data-theme] .student-id-card {
  border-color:color-mix(in srgb,var(--accent) 30%,white) !important;
}
.phone[data-theme] .studio-cover:after,
.phone[data-theme] .studio-intro:before,
.phone[data-theme] .atelier-device:after,
.phone[data-theme] .booth-room:after {
  background:radial-gradient(ellipse at 50% 50%,color-mix(in srgb,var(--accent) 78%,white) 0 15%,transparent 17%),radial-gradient(ellipse at 24% 42%,color-mix(in srgb,var(--accent) 52%,white) 0 35%,transparent 38%),radial-gradient(ellipse at 76% 42%,color-mix(in srgb,var(--accent) 52%,white) 0 35%,transparent 38%) !important;
}
/* 默认色调不得泄漏到非粉主题：选中态、滑块、进度条、装饰线跟随主题 */
.phone[data-theme] input[type="range"] { accent-color:var(--accent) !important; }

.phone[data-theme] .progress-fill,

.phone[data-theme="night"] { --wallpaper:#08090b; background:#08090b !important; color:#f3f5f7 !important; }
.phone[data-theme="night"] .home-root { background:transparent !important; }


/* 桌面组件恢复半透明毛玻璃：保留白色背景，玻璃表面使用当前主题变量 */
.phone .home-root .glass-card,
.phone .home-root .wide-widget,
.phone .home-root .mini-widget,
.phone .home-root .collage-widget,
.phone .home-root .second-feature,
.phone .home-root .music-widget,
.phone .home-root .quote-widget,
.phone .home-root .widget-row .glass-card {
  background:linear-gradient(145deg,var(--glass-strong),var(--glass)) !important;
  border:1px solid var(--glass-border) !important;
  box-shadow:0 8px 25px var(--shadow),inset 0 1px 0 rgba(255,255,255,.34) !important;
  backdrop-filter:blur(var(--blur,28px)) saturate(155%) !important;

}
.phone .home-root .app-icon,
.phone .home-root .dock,

  background:linear-gradient(145deg,var(--glass-strong),var(--icon-bg)) !important;
  border:1px solid var(--glass-border) !important;
  box-shadow:0 6px 16px var(--shadow),inset 0 1px 0 rgba(255,255,255,.42) !important;
  backdrop-filter:blur(var(--blur,28px)) saturate(155%) !important;

}

/* 夜幕黑仍为黑色半透明玻璃，不覆盖为不透明纯黑 */
.phone[data-theme="night"] .home-root .glass-card,
.phone[data-theme="night"] .home-root .wide-widget,
.phone[data-theme="night"] .home-root .mini-widget,

  border-color:rgba(255,255,255,.15) !important;
  box-shadow:0 8px 25px rgba(0,0,0,.18),inset 0 1px 0 rgba(255,255,255,.10) !important;
  backdrop-filter:blur(var(--blur,28px)) saturate(135%) !important;
  -webkit-backdrop-filter:blur(var(--blur,28px)) saturate(135%) !important;
}
.phone[data-theme="night"] .home-root .dock,
.phone[data-theme="night"] .home-root .app-icon,
.phone[data-theme="night"] .home-root .dock-icon {

  box-shadow:0 6px 16px rgba(0,0,0,.20),inset 0 1px 0 rgba(255,255,255,.10) !important;
}

.phone[data-theme="lilac"] { --case-accent:#9b8bc8; --case-light:#eee9f8; --case-deep:#6f609a; --charm-tone:#9b8bc8; --charm-highlight:#f6f3fc; }

<script id="mist-theme-accent-sync">
(function(){
  const phone=document.getElementById('phone');
  if(!phone) return;
  function syncThemeAccent(){
    const accent=getComputedStyle(phone).getPropertyValue('--accent').trim();
    if(accent) phone.style.setProperty('--mist-theme-accent',accent);
  }
  syncThemeAccent();
  const observer=new MutationObserver(function(records){
    if(records.some(function(record){return record.attributeName==='data-theme';})) syncThemeAccent();
  });
  observer.observe(phone,{attributes:true,attributeFilter:['data-theme']});
  window.addEventListener('load',syncThemeAccent,{once:true});
})();
</script>

<script id="flip-home-touch-scroll-repair">
/*
 * 手机触屏上的图标/组件原本设置了 touch-action:none，以支持长按拖动；
 * 因此浏览器不会替桌面执行原生纵向滚动。这里把普通的竖向滑动转成
 * 当前桌面页的 scrollTop；长按超过阈值进入整理模式后仍交给原拖动逻辑。
 */
(function installFlipHomeScrollRepair() {
  const phoneEl = document.querySelector('.phone');
  const homeEl = document.getElementById('homeRoot');
  if (!phoneEl || !homeEl) return;

  let gesture = null;
  let suppressTapUntil = 0;

  function activeHomePage(target) {
    const targetPage = target && target.closest ? target.closest('.home-page') : null;
    if (targetPage) return targetPage;
    const activeDot = document.querySelector('.page-dot.active');
    const pageIndex = activeDot ? activeDot.dataset.page : '0';
    return document.querySelector('.home-page[data-homepage="' + pageIndex + '"]');
  }

  homeEl.addEventListener('pointerdown', function (event) {
    if (!phoneEl.classList.contains('flip-shell-mode')) { gesture = null; return; }
    if (event.pointerType !== 'touch' && event.pointerType !== 'pen') return;
    if (event.button !== undefined && event.button !== 0) return;
    if (event.target.closest('.dock, .page-dots, .search-pill, .home-indicator')) return;

    const page = activeHomePage(event.target);
    if (!page) return;
    gesture = {
      pointerId: event.pointerId,
      page: page,
      startX: event.clientX,
      startY: event.clientY,
      lastY: event.clientY,
      scrolling: false
    };
  }, { passive: true });

  document.addEventListener('pointermove', function (event) {
    if (!gesture || gesture.pointerId !== event.pointerId) return;
    if (!phoneEl.classList.contains('flip-shell-mode') || phoneEl.classList.contains('arranging')) {
      gesture = null;
      return;
    }

    const g = gesture;
    const dx = event.clientX - g.startX;
    const dy = event.clientY - g.startY;

    if (!g.scrolling) {
      if (Math.hypot(dx, dy) < 8) return;
      /* 横向手势仍交给原来的桌面换页逻辑。 */
      if (Math.abs(dy) <= Math.abs(dx) * 1.12) { gesture = null; return; }
      if (g.page.scrollHeight <= g.page.clientHeight + 1) { gesture = null; return; }
      g.scrolling = true;
      suppressTapUntil = Date.now() + 360;
    }

    if (g.scrolling) {
      if (event.cancelable) event.preventDefault();
      g.page.scrollTop += g.lastY - event.clientY;
      g.lastY = event.clientY;
    }
  }, { passive: false });

  function finishGesture(event) {
    if (!gesture || (event && gesture.pointerId !== event.pointerId)) return;
    if (gesture.scrolling) suppressTapUntil = Date.now() + 360;
    gesture = null;
  }
  document.addEventListener('pointerup', finishGesture, { passive: true });
  document.addEventListener('pointercancel', finishGesture, { passive: true });

  /* 滑动结束时不误触打开刚刚滑过的应用。 */
  homeEl.addEventListener('click', function (event) {
    if (Date.now() < suppressTapUntil) {
      event.preventDefault();
      event.stopPropagation();
    }
  }, true);
})();
</script>

  const originalRunProactiveMessage=runProactiveMessage;
  runProactiveMessage=async function(contactId){
    const before=(chats[contactId]||[]).filter(m=>m.role==='assistant'&&!m.mistSticker).length;
    const result=await originalRunProactiveMessage.apply(this,arguments);
    const after=(chats[contactId]||[]).filter(m=>m.role==='assistant'&&!m.mistSticker).length;
    if(after>before)maybeSendAssistantSticker(contactId);
    return result;
  };

  // Hydrate IndexedDB-backed stickers and loopable assets after every app render.
  const originalRenderApp=renderApp;
  renderApp=function(id){const result=originalRenderApp.apply(this,arguments);if(id==='starChat')setTimeout(hydrateMistStickerImages,0);return result;};

  // Ensure call screens remain visible above the faux handset frame.
  document.addEventListener('click',function(event){
    const button=event.target.closest('[data-mist-action]');if(!button)return;
    const action=button.dataset.mistAction;
    if(action==='open-sticker-manager'){event.preventDefault();openStickerManager();}
    else if(action==='new-sticker-pack'){event.preventDefault();openStickerPackEditor();}
    else if(action==='edit-sticker-pack'){event.preventDefault();openStickerPackEditor(button.dataset.pack);}
    else if(action==='delete-sticker-pack'){event.preventDefault();const pack=mistStickerPacks.find(p=>p.id===button.dataset.pack);if(!pack)return;openModal('删除表情包合集？',`<p class="muted">确定删除「${esc(pack.name)}」合集吗？聊天中已发送的历史消息仍会保留记录，但已移除的素材可能无法显示。</p>`,`<button class="soft-btn" data-action="close-modal">取消</button><button class="primary-btn" data-mist-action="confirm-delete-sticker-pack" data-pack="${esc(pack.id)}">删除合集</button>`);}
    else if(action==='confirm-delete-sticker-pack'){mistStickerPacks=mistStickerPacks.filter(p=>p.id!==button.dataset.pack);persistStickerPacks();openStickerManager();showToast('合集已删除');}
    else if(action==='pick-sticker-files'){event.preventDefault();document.getElementById('mistStickerUpload')?.click();}
    else if(action==='remove-sticker-item'){if(!mistStickerDraft)return;syncStickerDraftFromForm();mistStickerDraft.items=mistStickerDraft.items.filter(i=>i.id!==button.dataset.item);renderStickerPackEditorKeepDraft();}
    else if(action==='open-sticker-picker'){event.preventDefault();openStickerPicker();}
    else if(action==='send-sticker'){event.preventDefault();const pack=button.dataset.pack,item=button.dataset.item;closeModal();sendStickerItem(pack,item,'user',activeContactId);}
    else if(action==='pick-contact-video-background'){event.preventDefault();document.getElementById('mistVideoBgUpload')?.click();}
    else if(action==='remove-contact-video-background'){const cid=button.dataset.contact;const draft=mistVideoBackgroundDrafts[cid]||[];mistVideoBackgroundDrafts[cid]=draft.filter(i=>i.id!==button.dataset.media);const list=document.getElementById('mistVideoBgList');if(list)list.innerHTML=renderVideoBgList(cid);hydrateMistMediaPreviews(list||document);}
    else if(action==='start-call'){event.preventDefault();closeModal();startMistCall(activeContactId,button.dataset.callType||'voice',false);}else if(action==='send-call-text'){event.preventDefault();sendMistCallText();}
    else if(action==='accept-call'){event.preventDefault();acceptMistCall();}
    else if(action==='reject-call'||action==='end-call'){event.preventDefault();finishMistCall();}
    else if(action==='minimize-call'){event.preventDefault();if(mistCall){finishMistCall();showToast('已结束通话窗口');}}
    else if(action==='toggle-call-mic'){event.preventDefault();toggleMistCallMic();}
    else if(action==='play-call-voice'){event.preventDefault();playCallSpeech();}
    else return;
    event.stopPropagation();
  },true);

  document.addEventListener('submit',function(event){if(event.target&&event.target.id==='mistCallForm'){event.preventDefault();sendMistCallText();}},true);
  document.addEventListener('keydown',function(event){if(event.target&&event.target.id==='mistCallInput'&&event.key==='Enter'&&!event.shiftKey&&!event.isComposing&&event.keyCode!==229){event.preventDefault();sendMistCallText();}},true);

  document.addEventListener('change',async function(event){
    const target=event.target;
    if(target?.id==='mistStickerUpload'){
      const files=Array.from(target.files||[]);await handleStickerFileSelection(target);return;
    }
    if(target?.id==='mistVideoBgUpload'){
      const files=Array.from(target.files||[]);target.value='';if(!files.length)return;
      const cid=target.dataset.contactVideoId||contactProfileEditingId;mistVideoBackgroundDrafts[cid]=mistVideoBackgroundDrafts[cid]||[];showToast('正在保存通话背景…');let added=0;
      for(const file of files){if(!(file.type.startsWith('image/')||file.type.startsWith('video/')))continue;try{const assetKey=await mistSaveAsset(file,'contact-video');mistVideoBackgroundDrafts[cid].push({id:idgen('bg'),assetKey,name:file.name||'通话背景',type:file.type,kind:file.type.startsWith('video/')?'video':'image'});added++;}catch(e){console.warn(e)}}
      const list=document.getElementById('mistVideoBgList');if(list)list.innerHTML=renderVideoBgList(cid);hydrateMistMediaPreviews(list||document);showToast(added?`已保存 ${added} 个通话背景`:'背景保存失败，请检查浏览器本地媒体库权限');return;
    }
  });

  // Commit video-background metadata before the existing contact form's submit handler saves the contact.
  document.addEventListener('submit',function(event){
    if(event.target?.id==='mistStickerPackForm'){event.preventDefault();saveStickerDraft(event.target);return;}
  });
  document.addEventListener('submit',function(event){
    if(event.target?.id!=='contactProfileForm')return;const id=document.getElementById('contactId')?.value||contactProfileEditingId;const backgrounds=JSON.parse(JSON.stringify(mistVideoBackgroundDrafts[id]||[]));let existing=contacts.find(c=>c.id===id);if(existing)existing.videoBackgrounds=backgrounds;else contacts.push({id,videoBackgrounds:backgrounds});
  },true);

  // Call invitation UI for the 5% random incoming-call event.
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')incomingCallCheck();});
  incomingCallCheck();
})();

</script>

<script id="mist-voice-notification-enhancement">
(function(){
  'use strict';
  // Keep older saved notification settings compatible.
  MESSAGE_SETTING_DEFAULTS.popupMode='each';
  if(!['each','last'].includes(messageSettings.popupMode))messageSettings.popupMode='each';
  window.mistVoiceExpandedIds=window.mistVoiceExpandedIds||new Set();
  const voiceAudioCache=new Map();
  let currentVoiceAudio=null,currentVoiceAudioKey='';
  let popupQueue=[],popupTimer=null,popupShowing=false;

  function escMist(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
  function errorText(err,context=''){
    const bits=[];if(context)bits.push(context);if(err){bits.push(`错误类型：${err.name||'Error'}`);bits.push(`错误信息：${err.message||String(err)}`);if(err.stack)bits.push(`堆栈信息：${String(err.stack).slice(0,5000)}`);}
    return bits.join('\n');
  }
  window.mistLastErrorText='';
  window.showMistErrorModal=function(title,err,context=''){
    const detail=errorText(err,context)||'发生未知错误。';window.mistLastErrorText=`${title}\n发生时间：${new Date().toLocaleString()}\n${detail}`;
    const body=`<section class="mist-error-card"><span class="mist-error-mark">!</span><p>操作没有成功。你可以复制下面的详细信息，方便排查接口、权限或服务商返回的问题。</p><pre id="mistErrorDetails">${escMist(window.mistLastErrorText)}</pre><div class="mist-error-actions"><button type="button" class="soft-btn" data-mist-voice-action="copy-error">复制报错信息</button><button type="button" class="primary-btn" data-action="close-modal">确认并关闭</button></div></section>`;
    openModal(title,body);
  };

  // Wrap the existing notification sheet, adding a saved popup batching preference.
  const originalOpenNotificationSettings=openMessageNotificationSettings;
  openMessageNotificationSettings=function(){
    originalOpenNotificationSettings.apply(this,arguments);
    const group=modalRoot.querySelector('.mist-notify-modal-group');if(!group)return;
    const mode=messageSettings.popupMode==='last'?'last':'each';
    group.insertAdjacentHTML('afterend',`<section class="mist-notify-popup-mode"><div><strong>网页弹窗显示方式</strong><small>控制一次回复包含多条消息时，网页内弹窗如何出现。</small></div><div class="mist-popup-mode-options"><button type="button" data-mist-popup-mode="each" class="${mode==='each'?'active':''}"><span>☷</span>每一条都弹一次</button><button type="button" data-mist-popup-mode="last" class="${mode==='last'?'active':''}"><span>↘</span>只弹最后一条</button></div></section>`);
  };

  function createPopupNode(){
    let popup=document.getElementById('mistIncomingPopup');
    if(popup)return popup;
    popup=document.createElement('button');popup.id='mistIncomingPopup';popup.className='mist-incoming-popup';popup.type='button';
    popup.addEventListener('click',()=>{
      const item={id:popup.dataset.contact};if(popupTimer){clearTimeout(popupTimer);popupTimer=null;}popup.remove();popupShowing=false;
      if(item.id&&contacts.some(c=>c.id===item.id)){activeContactId=item.id;store.set('activeContactId',activeContactId);chatThreadOpen=true;chatSettingsOpen=false;renderApp('starChat');}
      if(popupQueue.length)setTimeout(showNextPopup,220);
    });
    (document.querySelector('.phone')||document.body).appendChild(popup);return popup;
  }
  function showPopupItem(item){
    const popup=createPopupNode();popup.dataset.contact=item.contact?.id||'';
    const c=item.contact||{id:'',name:'雾屿通知'};
    popup.innerHTML=`<span class="mist-incoming-avatar">${c.avatar?`<img src="${escMist(c.avatar)}" alt="">`:escMist(String(displayContactName(c)||'雾').slice(0,1))}</span><span class="mist-incoming-copy"><strong>${escMist(displayContactName(c))}</strong><small>${escMist(String(item.text||'收到一条新消息').slice(0,110))}</small></span><span class="mist-incoming-time">现在</span>`;
    popup.classList.remove('show');requestAnimationFrame(()=>popup.classList.add('show'));popupShowing=true;
    if(popupTimer)clearTimeout(popupTimer);popupTimer=setTimeout(()=>{popup.remove();popupShowing=false;popupTimer=null;if(popupQueue.length)showNextPopup();},4300);
  }
  function showNextPopup(){if(!popupQueue.length){popupShowing=false;return;}const item=popupQueue.shift();showPopupItem(item);}
  showIncomingMessagePopup=function(contact,text){
    const item={contact:contact||{id:'',name:'雾屿通知'},text:String(text||'收到一条新消息')};
    if(messageSettings.popupMode==='last'){
      popupQueue=[];if(popupTimer)clearTimeout(popupTimer);popupTimer=null;document.getElementById('mistIncomingPopup')?.remove();popupShowing=false;showPopupItem(item);return;
    }
    popupQueue.push(item);if(!popupShowing)showNextPopup();
  };
  notifyIncomingMessage=function(contact,text,options={}){
    if(!messageSettings.enabled)return;
    if(messageSettings.messageSound)playMessageTone();
    if(messageSettings.systemNotifications&&typeof Notification!=='undefined'&&Notification.permission==='granted'){
      try{const n=new Notification(displayContactName(contact),{body:String(text||'收到一条新消息').slice(0,140),tag:'mist-chat-'+contact.id});n.onclick=()=>{window.focus();activeContactId=contact.id;store.set('activeContactId',activeContactId);chatThreadOpen=true;chatSettingsOpen=false;renderApp('starChat');try{n.close()}catch{}};}catch(e){console.warn('浏览器通知失败',e);}
    }
    if(options.showPopup!==false&&messageSettings.messagePopup)showIncomingMessagePopup(contact,text);
  };

  function urlForTts(service){
    let url=String(service||'').trim().replace(/\/+$/,'');if(!/^https?:\/\//i.test(url))throw new Error('联系人资料中的“语音服务地址”必须是完整的 http:// 或 https:// URL。');
    if(/\/audio\/speech$/i.test(url)||/\/text-to-speech\/[^/]+$/i.test(url))return url;
    if(/\/v\d+$/i.test(url))return url+'/audio/speech';
    if(/\/v\d+\//i.test(url))return url;
    return url+'/v1/audio/speech';
  }
  async function playVoiceMessage(contactId,messageKey){
    const contact=contacts.find(c=>c.id===contactId);const rows=chats[contactId]||[];const msg=rows.find(m=>String(m._mistMessageId||m.timestamp||'')===String(messageKey));
    if(!contact||!msg)return;
    const voiceCfg=store.get('voiceSettings',{provider:'openaitts',endpoint:'',key:'',model:'tts-1',format:'mp3',enabled:false});
    if(!String(contact.voiceId||'').trim()||!String(voiceCfg.endpoint||'').trim()){
      const card=[...document.querySelectorAll('.mist-voice-message[data-mist-voice-card]')].find(node=>String(node.dataset.mistVoiceCard||'')===String(messageKey));
      document.querySelectorAll('.mist-voice-message.is-sim-playing').forEach(other=>{other.classList.remove('is-sim-playing');if(other._mistSimTimer){clearTimeout(other._mistSimTimer);other._mistSimTimer=null;}const glyph=other.querySelector('.mist-voice-play-glyph');if(glyph)glyph.textContent='▶';const btn=other.querySelector('.mist-voice-play');if(btn)btn.setAttribute('aria-pressed','false');});
      if(!card)return;
      card.classList.add('is-sim-playing');const glyph=card.querySelector('.mist-voice-play-glyph'),btn=card.querySelector('.mist-voice-play');if(glyph)glyph.textContent='Ⅱ';if(btn)btn.setAttribute('aria-pressed','true');
      const seconds=Math.max(2,Math.min(24,Number(card.dataset.simDuration)||4));
      card._mistSimTimer=setTimeout(()=>{card.classList.remove('is-sim-playing');card._mistSimTimer=null;const g=card.querySelector('.mist-voice-play-glyph'),b=card.querySelector('.mist-voice-play');if(g)g.textContent='▶';if(b)b.setAttribute('aria-pressed','false');},seconds*1000);
      return;
    }
    const key=`${contactId}::${messageKey}`;
    try{
      if(currentVoiceAudio&&currentVoiceAudioKey===key){if(!currentVoiceAudio.paused){currentVoiceAudio.pause();return;}await currentVoiceAudio.play();return;}
      if(currentVoiceAudio){try{currentVoiceAudio.pause()}catch{}}
      let audioUrl=voiceAudioCache.get(key);
      if(!audioUrl){
        const v=voiceCfg;
        const endpoint=urlForTts(v.endpoint);
        const apiKey=String(v.key||apiSettings?.key||'').trim();
        const headers={'Content-Type':'application/json','Accept':'audio/mpeg, audio/*, application/octet-stream'};if(apiKey)headers.Authorization='Bearer '+apiKey;
        const payload={model:String(v.model||'tts-1'),input:String(msg.content||''),voice:String(contact.voiceId).trim(),response_format:String(v.format||'mp3')};
        let res;try{res=await fetch(endpoint,{method:'POST',headers,body:JSON.stringify(payload)});}catch(fetchErr){throw new Error(`无法连接语音服务：${fetchErr.message||fetchErr}\n请求地址：${endpoint}\n可能原因：网络异常、跨域 CORS 未开放、证书/地址错误或服务不可用。`)}
        if(!res.ok){let body='';try{body=await res.text()}catch{}throw new Error(`语音服务返回 HTTP ${res.status} ${res.statusText||''}\n请求地址：${endpoint}\n服务端响应：${body.slice(0,4000)||'(空响应)'}`)}
        const blob=await res.blob();if(!blob||!blob.size)throw new Error(`语音服务返回了空音频。\n请求地址：${endpoint}\n响应类型：${res.headers.get('content-type')||'未知'}`);
        const type=(res.headers.get('content-type')||blob.type||'').toLowerCase();if(type.includes('json')||type.includes('text/')){let txt='';try{txt=await blob.text()}catch{}throw new Error(`语音服务返回的不是音频数据。\nContent-Type：${type}\n响应内容：${txt.slice(0,3000)}`)}
        audioUrl=URL.createObjectURL(blob);voiceAudioCache.set(key,audioUrl);
      }
      const audio=new Audio(audioUrl);audio.preload='auto';audio.volume=1;currentVoiceAudio=audio;currentVoiceAudioKey=key;
      audio.addEventListener('ended',()=>{if(currentVoiceAudio===audio){currentVoiceAudio=null;currentVoiceAudioKey='';}});
      try{await audio.play();}catch(playErr){throw new Error(`音频已取得，但浏览器播放失败：${playErr.message||playErr}\n请检查设备媒体音量、浏览器自动播放权限和音频格式兼容性。`)}
    }catch(err){showMistErrorModal('语音播放失败',err,`联系人：${displayContactName(contact)}\n音色 ID：${contact.voiceId}\n设置中的语音服务地址：${(store.get('voiceSettings',{}).endpoint)||'(未填写)'}\n提示：接口按当前语音设置中的地址请求；请检查服务地址、API Key、模型、音色 ID 与输出格式。`);}
  }

  window.mistPlayVoiceMessage=playVoiceMessage;
  window.mistStopVoicePlayback=function(){if(currentVoiceAudio){try{currentVoiceAudio.pause();currentVoiceAudio.currentTime=0;}catch{}currentVoiceAudio=null;currentVoiceAudioKey='';}};

  function toggleVoiceTranscript(contactId,messageKey){const k=`${contactId}::${messageKey}`;if(window.mistVoiceExpandedIds.has(k))window.mistVoiceExpandedIds.delete(k);else window.mistVoiceExpandedIds.add(k);if(currentApp!=='starChat'){activeContactId=contactId;chatThreadOpen=true;}renderApp('starChat');}

  document.addEventListener('click',function(event){
    const mode=event.target.closest('[data-mist-popup-mode]');if(mode){event.preventDefault();messageSettings.popupMode=mode.dataset.mistPopupMode==='last'?'last':'each';saveMessageSettings();openMessageNotificationSettings();return;}
    const button=event.target.closest('[data-mist-voice-action]');if(!button)return;const action=button.dataset.mistVoiceAction;
    if(action==='toggle'){event.preventDefault();toggleVoiceTranscript(button.dataset.contact,button.dataset.message);}
    else if(action==='play'){event.preventDefault();playVoiceMessage(button.dataset.contact,button.dataset.message);}
    else if(action==='copy-error'){event.preventDefault();const text=window.mistLastErrorText||document.getElementById('mistErrorDetails')?.textContent||'';const fallback=()=>{const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand('copy')}catch{}ta.remove();if(ok)showToast('报错信息已复制');else showToast('复制失败，请长按报错内容手动复制');};if(navigator.clipboard?.writeText)navigator.clipboard.writeText(text).then(()=>showToast('报错信息已复制')).catch(fallback);else fallback();}
  },true);

  // When proactive messages are created in the background, occasionally turn one message into a voice card.
  const previousProactive=runProactiveMessage;
  runProactiveMessage=async function(contactId){
    const before=(chats[contactId]||[]).length;const result=await previousProactive.apply(this,arguments);
    const created=(chats[contactId]||[]).slice(before).filter(m=>m&&m.role==='assistant'&&!m.mistSticker&&!m.mistVoice&&String(m.content||'').trim());
    if(created.length&&Math.random()<0.10){created[created.length-1].mistVoice=true;store.set('chats',chats);if(currentApp==='starChat'&&activeContactId===contactId&&!chatSettingsOpen)renderApp('starChat');}
    return result;
  };
})();
</script>
