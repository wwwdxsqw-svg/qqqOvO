 function renderWorldBookcase(){const f=window.mistWorldBookFilter||'all';const all=mistWorldBooksV2.filter(b=>f==='all'||(f==='global'&&b.scope==='global')||(f==='local'&&b.scope==='local')||(f==='disabled'&&!b.enabled));const filters=[['all','全部藏书'],['global','全局世界书'],['local','角色专属'],['disabled','已停用']];const shelf=all.map((b,i)=>`<article class="mist-world-book book-tone-${i%6} ${b.enabled?'':'is-disabled'}" data-worldbook-card data-worldbook-id="${escapeHTML(b.id)}"><button type="button" class="mist-world-bookopen" data-action="mist-worldbook-open" data-worldbook="${escapeHTML(b.id)}" aria-label="抽出并阅读 ${escapeHTML(b.title)}"><span class="mist-world-book-top-rule"></span><span class="mist-world-book-mark">MIST ARCHIVE <b>${String(i+1).padStart(3,'0')}</b></span><strong class="mist-world-booktitle">${escapeHTML(b.title)}</strong><span class="mist-world-booktype">${b.scope==='global'?'全局藏书':`角色专属 · ${(b.contactIds||[]).length} 位`}</span><span class="mist-world-book-stamp">${b.enabled?'IN USE':'ARCHIVED'}</span><span class="mist-world-book-pull">抽出阅读</span></button><div class="mist-world-book-foot"><button type="button" data-action="mist-worldbook-toggle" data-worldbook="${escapeHTML(b.id)}">${b.enabled?'已启用':'已停用'}</button><button type="button" data-action="mist-worldbook-edit" data-worldbook="${escapeHTML(b.id)}">编辑</button><button type="button" data-action="mist-worldbook-delete" data-worldbook="${escapeHTML(b.id)}">移除</button></div></article>`).join('');return baseView('worldbook',`<section class="mist-worldbook-shell"><header class="mist-worldbook-top"><div><small>THE MIST LIBRARY / PRIVATE COLLECTION</small><strong>世界书柜 <span class="mist-worldbook-count">${mistWorldBooksV2.length} 册藏书</span></strong><p>把世界规则收进书脊，需要时抽出阅读；放回后仍在原位。</p></div><button class="primary-btn" data-action="mist-worldbook-new">＋ 新建藏书</button></header><div class="mist-worldbook-overview"><div class="mist-worldbook-overview-line"><span class="mist-worldbook-shelf-emblem">${mistMemorySvg('long')}</span><div><strong>WORLD BUILDING ARCHIVE</strong><small>已启用 ${mistWorldBooksV2.filter(b=>b.enabled).length} 册 · 全局 ${mistWorldBooksV2.filter(b=>b.scope==='global'&&b.enabled).length} 册 · 角色专属 ${mistWorldBooksV2.filter(b=>b.scope==='local'&&b.enabled).length} 册</small></div></div><div class="mist-worldbook-status-line"><span><i></i> 藏书已同步</span><span>点击书脊抽出</span><span>打开阅读后可放回</span></div></div><div class="mist-worldbook-filters">${filters.map(([id,label])=>`<button type="button" class="${f===id?'active':''}" data-action="mist-worldbook-filter" data-filter="${id}">${label}${id==='all'?' · '+mistWorldBooksV2.length:''}</button>`).join('')}</div><div class="mist-bookcase-frame"><div class="mist-bookcase-crown"><span></span><small>MIST LIBRARY</small><span></span></div><div class="mist-worldbook-shelf">${shelf||'<div class="mist-world-empty"><span class="mist-world-empty-mark">M</span><strong>书柜目前是空的</strong><p>创建第一本世界书，记录全局规则或角色专属设定。</p><button type="button" class="primary-btn" style="margin-top:10px" data-action="mist-worldbook-new">新建第一本书</button></div>'}</div><div class="mist-bookcase-plinth"><span></span><b>THE ARCHIVE OF WORLDS</b><span></span></div></div><p class="mist-world-shelf-note">全局书会进入所有角色的对话背景；局部书只会进入绑定角色的上下文。停用的书仍会留在书柜里，但不会参与聊天。</p></section>`,'mist-worldbook-new')}
 renderWorldBook=renderWorldBookcase;
 function mistAnimateWorldBookOpen(id,button){const card=button?.closest('[data-worldbook-card]')||document.querySelector(`[data-worldbook-card][data-worldbook-id="${CSS.escape(String(id))}"]`);if(card?.classList.contains('is-pulling'))return;if(card){card.classList.add('is-pulling');card.style.zIndex='8';}window.setTimeout(()=>{if(card){card.classList.remove('is-pulling');card.style.zIndex='';}mistOpenWorldBook(id);},320);}
 function mistOpenWorldBook(id){const b=mistWorldBooksV2.find(x=>x.id===id);if(!b)return;document.querySelector('.mist-bookreader-overlay')?.remove();const bound=(b.contactIds||[]).map(cid=>displayContactName(contacts.find(c=>c.id===cid)||{})).join('、')||'尚未绑定角色';const phone=document.querySelector('.phone')||document.body;const overlay=document.createElement('section');overlay.className='mist-bookreader-overlay';overlay.setAttribute('role','dialog');overlay.setAttribute('aria-modal','true');overlay.setAttribute('aria-label','世界书阅读器');overlay.innerHTML=`<div class="mist-bookreader-dim"></div><div class="mist-bookreader-stage"><div class="mist-bookreader-kicker"><span>WORLD LIBRARY / READING MODE</span><span>${b.enabled?'已启用':'已停用'}</span></div><div class="mist-bookreader-book" id="mistBookReaderBook"><div class="mist-bookreader-cover"><div class="mist-reader-cover-inner"><span class="mist-reader-cover-index">MIST ARCHIVE · ${String(mistWorldBooksV2.indexOf(b)+1).padStart(3,'0')}</span><span class="mist-reader-cover-seal">M</span><h2>${escapeHTML(b.title)}</h2><i></i><small>${b.scope==='global'?'GLOBAL WORLD BOOK':'CHARACTER EDITION'}</small><span class="mist-reader-cover-foot">THE MIST LIBRARY</span></div></div><div class="mist-bookreader-pages"><article class="mist-reader-page mist-reader-left"><span class="mist-reader-page-kicker">VOLUME RECORD</span><div class="mist-reader-page-rule"></div><h3>${escapeHTML(b.title)}</h3><p class="mist-reader-scope">${b.scope==='global'?'全局世界书':'角色专属世界书'}</p><div class="mist-reader-metadata"><span>状态</span><b>${b.enabled?'已启用':'已停用'}</b><span>收录</span><b>${new Date(b.createdAt||Date.now()).toLocaleDateString('zh-CN')}</b><span>绑定范围</span><b>${b.scope==='global'?'所有角色':escapeHTML(bound)}</b></div><div class="mist-reader-page-note">这本书的设定会在符合适用范围时加入角色的聊天上下文。</div><span class="mist-reader-page-number">— 01 —</span></article><article class="mist-reader-page mist-reader-right"><span class="mist-reader-page-kicker">CONTENT / 正文</span><div class="mist-reader-page-rule"></div><h3>世界设定</h3><div class="mist-reader-body">${escapeHTML(b.body)}</div><span class="mist-reader-page-number">— 02 —</span></article></div></div><div class="mist-bookreader-actions"><button type="button" class="soft-btn" data-action="mist-worldbook-reader-toggle" data-worldbook="${escapeHTML(b.id)}">${b.enabled?'停用这本书':'启用这本书'}</button><button type="button" class="soft-btn" data-action="mist-worldbook-reader-edit" data-worldbook="${escapeHTML(b.id)}">编辑内容</button><button type="button" class="primary-btn mist-book-return-button" data-action="mist-worldbook-return">放回书柜</button></div><p class="mist-bookreader-footnote">点击“放回书柜”，书页会合拢，藏书回到原位。</p></div>`;phone.appendChild(overlay);overlay.addEventListener('click',e=>{if(e.target.classList.contains('mist-bookreader-dim'))mistReturnWorldBook();});requestAnimationFrame(()=>overlay.classList.add('is-open'));window.setTimeout(()=>overlay.querySelector('.mist-bookreader-book')?.classList.add('is-open'),80);}
 function mistReturnWorldBook(done){const overlay=document.querySelector('.mist-bookreader-overlay');if(!overlay){if(typeof done==='function')done();return;}const activeId=overlay.querySelector('[data-worldbook]')?.dataset.worldbook;const card=activeId?document.querySelector(`[data-worldbook-card][data-worldbook-id="${CSS.escape(String(activeId))}"]`):null;overlay.classList.add('is-returning');overlay.querySelector('.mist-bookreader-book')?.classList.remove('is-open');if(card)card.classList.add('is-return-arrived');window.setTimeout(()=>{overlay.remove();if(card){card.classList.remove('is-return-arrived');card.style.zIndex='';}if(typeof done==='function')done();},430);}
 function mistSaveWorldBookForm(form){const id=form.querySelector('#mistWorldBookId')?.value||'';const title=form.querySelector('#mistWorldBookTitle')?.value.trim()||'';const body=form.querySelector('#mistWorldBookBody')?.value.trim()||'';const scope=form.querySelector('#mistWorldBookScope')?.value||'global';const contactIds=[...form.querySelectorAll('input[name="mistWorldContact"]:checked')].map(x=>x.value);const enabled=!!form.querySelector('#mistWorldBookEnabled')?.checked;if(!title||!body)return;if(scope==='local'&&!contactIds.length){showToast('局部世界书至少绑定一个角色');return;}let b=id?mistWorldBooksV2.find(x=>x.id===id):null;if(b)Object.assign(b,{title,body,scope,contactIds:scope==='local'?contactIds:[],enabled,updatedAt:mistNow()});else mistWorldBooksV2.push({id:'world_'+mistNow().toString(36)+'_'+Math.random().toString(36).slice(2,6),title,body,scope,contactIds:scope==='local'?contactIds:[],enabled,createdAt:mistNow(),updatedAt:mistNow()});mistPersistBooks();closeModal();renderApp('worldbook');showToast('世界书已保存到书架');}
 function mistUpdateMemoryFilters(){const input=document.getElementById('mistMemorySearch');if(input){store.set('mistMemorySearch',input.value);const q=input.value.toLowerCase().trim();let n=0;document.querySelectorAll('[data-memory-file]').forEach(card=>{const yes=!q||String(card.dataset.memorySearch||'').toLowerCase().includes(q);card.hidden=!yes;if(yes)n++;});const task=document.querySelector('.mist-memory-taskbar span:nth-child(2)');if(task)task.textContent=n+' 项可见 · 自动关键词索引';}}
 document.addEventListener('input',e=>{if(e.target?.id==='mistMemorySearch')mistUpdateMemoryFilters();});
 document.addEventListener('keydown',e=>{if(currentApp!=='moments')return;if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();document.getElementById('mistMemorySearch')?.focus();}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='n'){e.preventDefault();showToast('互动记忆会在聊天中自动形成');}});
 document.addEventListener('pointermove',e=>{const os=document.getElementById('mistMemoryOS');const cursor=document.getElementById('mistMemoryOSCursor');if(!os||!cursor||e.pointerType==='touch')return;const r=os.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom){cursor.style.display='none';return;}cursor.style.display='block';cursor.style.left=(e.clientX-r.left+3)+'px';cursor.style.top=(e.clientY-r.top+3)+'px';});
 document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.querySelector('.mist-bookreader-overlay')){e.preventDefault();mistReturnWorldBook();}});
 document.addEventListener('click',e=>{const btn=e.target.closest('[data-action]');if(!btn)return;const action=btn.dataset.action;const mid=btn.dataset.memory;const wid=btn.dataset.worldbook;
  if(action==='mist-memory-new'||action==='mist-memory-type-new'){showToast('互动记忆会在聊天中自动形成');return;}
  if(action==='mist-memory-edit'){mistOpenMemoryViewer(mid);return;}
  if(action==='mist-memory-choose-role'){
   const roleChoices=contacts.filter(c=>c&&c.id).map(c=>{const cid=String(c.id);const count=mistMemoryItemsV2.filter(m=>String(m.contactId)===cid).length;const current=cid===String(window.mistMemoryActiveContact||store.get('mistMemoryActiveContact',''));return `<button type="button" class="mist-memory-role-choice ${current?'is-current':''}" data-action="mist-memory-select-role" data-contact="${escapeHTML(cid)}"><span class="mist-memory-role-choice-icon">${mistMemorySvg('local')}</span><span class="mist-memory-role-choice-copy"><strong>${escapeHTML(displayContactName(c))}</strong><small>${count} 条独立记忆 · 仅属于该角色</small></span><span class="mist-memory-role-choice-state">${current?'正在查看':'查看档案'}</span></button>`;}).join('');
   openModal('切换角色记忆档案',`<div class="mist-memory-role-picker"><p>选择要查看的角色。每位角色的记忆单独保存，只会用于该角色的聊天，不会与其他角色共享。</p><div class="mist-memory-role-choice-list">${roleChoices||'<div class="empty-state">还没有联系人，请先创建角色。</div>'}</div></div>`,`<button type="button" class="soft-btn" data-action="close-modal">取消</button>`);return;
  }
  if(action==='mist-memory-select-role'){
   const cid=String(btn.dataset.contact||'');const chosen=contacts.find(c=>String(c.id)===cid);if(!chosen){showToast('找不到这个角色，请刷新后重试');return;}
   window.mistMemoryActiveContact=cid;store.set('mistMemoryActiveContact',cid);window.mistMemoryActiveFilter='all';store.set('mistMemoryActiveFilter','all');store.set('mistMemorySearch','');closeModal();renderApp('moments');showToast('已切换到 '+displayContactName(chosen)+' 的独立记忆');return;
  }
  if(action==='mist-memory-filter'){window.mistMemoryActiveFilter=btn.dataset.filter||'all';store.set('mistMemoryActiveFilter',window.mistMemoryActiveFilter);renderApp('moments');return;}
  if(action==='mist-memory-contact-filter'){window.mistMemoryActiveContact=String(btn.dataset.contact||'');store.set('mistMemoryActiveContact',window.mistMemoryActiveContact);window.mistMemoryActiveFilter='all';store.set('mistMemoryActiveFilter','all');store.set('mistMemorySearch','');renderApp('moments');return;}
  if(action==='mist-memory-hotkey'){const k=btn.dataset.hotkey;if(k==='new'){showToast('互动记忆会在聊天中自动形成');}else if(k==='search')document.getElementById('mistMemorySearch')?.focus();else {window.mistMemoryActiveFilter=k==='core'?'core':'short';store.set('mistMemoryActiveFilter',window.mistMemoryActiveFilter);renderApp('moments');}return;}
  if(action==='mist-memory-promote'){const m=mistMemoryItemsV2.find(x=>x.id===mid);if(m){m.type=m.type==='core'?'long':'core';m.updatedAt=mistNow();mistPersistMemory();renderApp('moments');showToast(m.type==='core'?'已升为核心记忆':'已调整为长期记忆');}return;}
  if(action==='mist-memory-fade'){const m=mistMemoryItemsV2.find(x=>x.id===mid);if(m){m.type='fading';m.updatedAt=mistNow();mistPersistMemory();renderApp('moments');showToast('已移入淡忘记忆，内容仍会保留');}return;}
  if(action==='mist-memory-toggle'){const m=mistMemoryItemsV2.find(x=>x.id===mid);if(m){m.enabled=!m.enabled;m.updatedAt=mistNow();if(m.source==='角色长期记忆'&&m.scope==='local'){roleMemories[m.contactId]=m.enabled?m.content:'';store.set('roleMemories',roleMemories);}mistPersistMemory();renderApp('moments');showToast(m.enabled?'记忆已启用':'记忆已停用');}return;}
  if(action==='mist-memory-delete'){const m=mistMemoryItemsV2.find(x=>x.id===mid);if(m&&confirm('确定删除这条记忆？删除后它不会再被角色检索。')){if(m.source==='角色长期记忆'&&m.scope==='local'){roleMemories[m.contactId]='';store.set('roleMemories',roleMemories);}mistMemoryItemsV2=mistMemoryItemsV2.filter(x=>x.id!==mid);mistPersistMemory();renderApp('moments');}return;}
  if(action==='mist-worldbook-new'){mistOpenWorldBookEditor('');return;}
  if(action==='mist-worldbook-edit'){closeModal();mistOpenWorldBookEditor(wid);return;}
  if(action==='mist-worldbook-open'){mistAnimateWorldBookOpen(wid,btn);return;}
  if(action==='mist-worldbook-return'){mistReturnWorldBook();return;}
  if(action==='mist-worldbook-reader-edit'){mistReturnWorldBook(()=>mistOpenWorldBookEditor(wid));return;}
  if(action==='mist-worldbook-reader-toggle'){const book=mistWorldBooksV2.find(x=>x.id===wid);if(book){book.enabled=!book.enabled;book.updatedAt=mistNow();mistPersistBooks();mistReturnWorldBook(()=>{renderApp('worldbook');showToast(book.enabled?'世界书已启用':'世界书已停用');});}return;}
  if(action==='mist-worldbook-filter'){window.mistWorldBookFilter=btn.dataset.filter||'all';store.set('mistWorldBookFilter',window.mistWorldBookFilter);renderApp('worldbook');return;}
  if(action==='mist-worldbook-toggle'){const b=mistWorldBooksV2.find(x=>x.id===wid);if(b){b.enabled=!b.enabled;b.updatedAt=mistNow();mistPersistBooks();closeModal();renderApp('worldbook');showToast(b.enabled?'世界书已启用':'世界书已停用');}return;}
  if(action==='mist-worldbook-delete'){const b=mistWorldBooksV2.find(x=>x.id===wid);if(b&&confirm('确定把这本世界书从书架移除吗？')){mistWorldBooksV2=mistWorldBooksV2.filter(x=>x.id!==wid);mistPersistBooks();closeModal();renderApp('worldbook');}return;}
 });
 // Memory is intentionally not imported from editable notes, journals, profile fields, or other apps.
 // World-book forms remain independently editable.
 document.addEventListener('submit',e=>{const form=e.target;if(form?.id==='mistWorldBookForm'){e.preventDefault();e.stopImmediatePropagation();mistSaveWorldBookForm(form);}},true);
 // Keyboard shortcuts act like desktop controls; complete their action after existing generic handlers.
 document.addEventListener('click',e=>{const b=e.target.closest('[data-action="mist-memory-new"],[data-action="mist-memory-edit"],[data-action="mist-memory-filter"],[data-action="mist-memory-promote"],[data-action="mist-memory-fade"],[data-action="mist-memory-toggle"],[data-action="mist-memory-hotkey"],[data-action="mist-memory-type-new"],[data-action="mist-memory-delete"],[data-action="mist-worldbook-new"],[data-action="mist-worldbook-edit"],[data-action="mist-worldbook-open"],[data-action="mist-worldbook-filter"],[data-action="mist-worldbook-toggle"],[data-action="mist-worldbook-delete"]');if(!b)return;const action=b.dataset.action;const id=b.dataset.memory;
  if(action==='mist-memory-new'||action==='mist-memory-edit'||action==='mist-memory-filter'||action==='mist-memory-promote'||action==='mist-memory-fade'||action==='mist-memory-toggle'||action==='mist-memory-hotkey'||action==='mist-memory-type-new'||action==='mist-memory-delete'||action==='mist-worldbook-new'||action==='mist-worldbook-edit'||action==='mist-worldbook-open'||action==='mist-worldbook-filter'||action==='mist-worldbook-toggle'||action==='mist-worldbook-delete') { /* handled by the first delegated listener */ }
 });
 // Habits and completed calendar interactions can be recalled from other apps as short-term activity, too.
 const previousHandleActionV2=handleAction;
 handleAction=function(action,el){return previousHandleActionV2(action,el)};
 window.mistRenderMemorySystem=renderMemorySystem;
 // Re-render the home labels from the updated app metadata without changing saved icon order.
 try{renderHome()}catch(e){console.warn('记忆应用名称刷新失败',e)}
})();
</script>

 function qOpenRolePhone(contactId){const c=contacts.find(x=>String(x.id)===String(contactId));if(!c)return;const p=qEnsurePhone(c);mistRolePhoneOpenFor=String(c.id);mistRolePhoneApp='home';mistRolePhoneConversation='';if(Math.random()<0.30){mistQueryNoticedFlags[c.id]={pending:true,createdAt:qNow()};store.set('mistQueryNoticedFlagsV1',mistQueryNoticedFlags);}qSaveLog({kind:'user-view-role',title:`查看了 ${displayContactName(c)} 的手机`,summary:`打开角色设备，检查联系人、信息、备忘录、购买记录等应用。`,apps:[],contactId:String(c.id),roleName:displayContactName(c)});renderApp('notifications');if(!p.generatedFromAI&&apiSettings?.endpoint&&apiSettings?.model&&apiSettings?.key){qGenerateRolePhoneRecords(c,false);}}

 const qPhoneTamperFields={

 function qOpenPhoneTamper(appId){
  const c=contacts.find(x=>String(x.id)===String(mistRolePhoneOpenFor));const p=qEnsurePhone(c);if(!c||!p)return;
  let label='',value=null,kind='array',key='';
  if(appId==='conversation'){
   if(String(mistRolePhoneConversation)==='me'){
    openModal('真实聊天记录',`<div class="mist-rp-tamper-help"><strong>这里显示的是你与角色的真实聊天记录</strong><p>为了避免把真实聊天和模拟手机资料混在一起，这个入口不修改真实对话。你可以返回信息应用，打开角色手机中的第三方会话，再编辑模拟聊天文字。</p></div>`,'<button type="button" class="primary-btn" data-action="close-modal">知道了</button>');return;
   }
   label='第三方聊天';kind='array';key=String(mistRolePhoneConversation);value=p.conversations[key]||[];
  }else if(appId==='messages'){
   label='全部模拟会话';kind='object';key='conversations';value=p.conversations||{};
  }else{
   const field=qPhoneTamperFields[appId];if(!field){showToast('这个应用暂无可编辑的模拟记录');return;}label=field.label;key=field.key;kind=field.type;value=p[key]||[];
  }
  const help=`<div class="mist-rp-tamper-help"><strong>只修改这台角色手机里的模拟${qEsc(label)}。</strong><p>保存后会立即生效，不会改动真实聊天设置，也不会给角色发送通知。可以编辑、添加、删除记录，或改动日期、备注、金额和第三方聊天内容。</p></div>`;
  openModal('编辑模拟记录',`${help}<label class="field-label" for="mistPhoneTamperJson">${qEsc(label)} · JSON</label><textarea id="mistPhoneTamperJson" class="textarea mist-phone-tamper-json" spellcheck="false" rows="13">${qEsc(JSON.stringify(value,null,2))}</textarea><p class="tiny muted">保存后会立即更新模拟手机中的显示。数组用 [ ]，对象用 { }；保留双引号和逗号。</p>`,`<button type="button" class="soft-btn" data-action="close-modal">取消</button><button type="button" class="primary-btn" data-action="query-role-phone-tamper-save" data-tamper-app="${qEsc(appId)}" data-tamper-key="${qEsc(key)}" data-tamper-kind="${kind}">保存修改</button>`);
 }
 function qSavePhoneTamper(el){
  const c=contacts.find(x=>String(x.id)===String(mistRolePhoneOpenFor));const p=qEnsurePhone(c);if(!c||!p)return true;
  const area=document.getElementById('mistPhoneTamperJson');let parsed;
  try{parsed=JSON.parse(area?.value||'');}catch(e){showToast('JSON 格式有误，请检查逗号、引号和括号');return true;}
  const kind=el.dataset.tamperKind,key=el.dataset.tamperKey,appId=el.dataset.tamperApp;
  if(kind==='array'&&!Array.isArray(parsed)){showToast('该应用的数据必须是数组（[ ]）');return true;}
  if(kind==='object'&&(!parsed||typeof parsed!=='object'||Array.isArray(parsed))){showToast('该数据需要是 JSON 对象（{ }）');return true;}
  if(appId==='conversation')p.conversations[key]=parsed;
  else if(appId==='messages')p.conversations=parsed;
  else if(Object.values(qPhoneTamperFields).some(f=>f.key===key))p[key]=parsed;
  else {showToast('无法识别这类手机数据');return true;}
  p.lastManualEditAt=qNow();qPersistPhoneData();closeModal();renderApp('notifications');showToast('模拟记录已悄悄修改');return true;
 }
 function qHandleAction(action,el){const d=el.dataset;const c=contacts.find(x=>String(x.id)===String(mistRolePhoneOpenFor));const p=qEnsurePhone(c);switch(action){

  case'query-clear-logs':openModal('清空查询记录',`<p class="muted" style="font-size:12px;line-height:1.7">将删除查询应用中的本地查看记录，角色手机中的联系人、备忘录和购买记录不会受影响。</p>`,`<button class="soft-btn" data-action="close-modal">取消</button><button class="primary-btn" data-action="query-clear-logs-confirm">清空记录</button>`);return true;

  case'query-role-open-conversation':mistRolePhoneConversation=d.conversation||'me';mistRolePhoneApp='conversation';renderApp('notifications');return true;
  case'query-role-send-to-contact':qRoleSendToContact(d.roleContact);return true;
  case'query-role-add-contact':qRoleAddContact();return true;
  case'query-role-delete-contact':qRoleConfirmDelete('contact',d.roleContact);return true;
  case'query-role-edit-note':qRoleEditNote(d.note||'');return true;
  case'query-role-delete-note':qRoleConfirmDelete('note',d.note);return true;
  case'query-role-edit-purchase':qRoleEditPurchase(d.purchase||'');return true;
  case'query-role-delete-purchase':qRoleConfirmDelete('purchase',d.purchase);return true;
  case'query-role-delete-confirm':if(p&&mistPendingDelete.id){if(mistPendingDelete.type==='contact'){p.contacts=p.contacts.filter(x=>String(x.id)!==String(mistPendingDelete.id));delete p.conversations[mistPendingDelete.id];}else if(mistPendingDelete.type==='note')p.notes=p.notes.filter(x=>String(x.id)!==String(mistPendingDelete.id));else if(mistPendingDelete.type==='purchase')p.purchases=p.purchases.filter(x=>String(x.id)!==String(mistPendingDelete.id));qPersistPhoneData();}mistPendingDelete={type:'',id:''};closeModal();renderApp('notifications');return true;

function currentWidgetOrder(html){

 }

 }).join('');

// Five columns, configurable rows, saved positions and visible empty slots make the home screen spatially editable.
function pageCellFromElement(el){const empty=el?.closest?.('.app-empty-slot');if(empty)return {page:Number(empty.dataset.page)||0,slot:Number(empty.dataset.slot)||0};const tile=el?.closest?.('.app-tile');if(tile){const p=tile.closest('.home-page'),grid=tile.closest('.app-grid');return {page:Number(p?.dataset.homepage)||0,slot:Number(tile.dataset.homeSlot??0)}}const grid=el?.closest?.('.app-grid');if(grid){const rect=grid.getBoundingClientRect(),x=window.__mistDropX||rect.left,y=window.__mistDropY||rect.top,cs=getComputedStyle(grid),cols=4,rowH=parseFloat(cs.gridAutoRows)||62;return {page:Number(grid.dataset.appGridPage)||0,slot:Math.max(0,Math.min(capacity()-1,Math.floor((y-rect.top)/rowH)*cols+Math.floor((x-rect.left)/(rect.width/cols))))}}return null;}
dragTargetAt=function(x,y){
 window.__mistDropX=x;window.__mistDropY=y;const el=document.elementFromPoint(x,y);if(!el||!homeRoot.contains(el))return null;
 if(homeDrag?.kind==='widget'){const w=el.closest('.home-widget');if(w)return {type:'widget',el:w};const stack=el.closest('.home-widget-stack');if(stack)return {type:'widget-stack',el:stack};return null;}
 const dockApp=el.closest('.dock-app');if(dockApp)return {type:'dock-app',el:dockApp};const emptyDock=el.closest('.dock-empty-slot');if(emptyDock)return {type:'dock-empty',el:emptyDock};const tile=el.closest('.app-tile');if(tile)return {type:'home-app',el:tile};
 const empty=el.closest('.app-empty-slot');if(empty)return {type:'app-empty',el:empty,page:Number(empty.dataset.page)||0,slot:Number(empty.dataset.slot)||0};
 if(el.closest('.home-widget,.home-widget-stack'))return null;const grid=el.closest('.app-grid');if(grid){const target=pageCellFromElement(grid);return {type:'app-grid',el:grid,page:target.page,slot:target.slot};}
 const dock=el.closest('.dock');if(dock){const rect=dock.getBoundingClientRect(),slot=Math.max(0,Math.min(3,Math.floor(((x-rect.left)/Math.max(1,rect.width))*4)));return {type:'dock',el:dock,slot};}return null;

function freePosition(exceptId,page,slot){let s=Math.max(0,Math.min(capacity()-1,slot)),p=Math.max(0,page);const occupied=id=>Object.keys(homePositions).some(other=>other!==exceptId&&!dockOrder.includes(other)&&homePositions[other]?.page===p&&homePositions[other]?.slot===s);while(occupied()){s++;if(s>=capacity()){s=0;p++}}return {page:p,slot:s};}

 if(!homeDrag||!target)return false;const d=homeDrag;
 if(d.kind==='widget'){

  if(target.type!=='widget'&&target.type!=='widget-stack')return false;const targetStack=target.el.closest?.('.home-widget-stack')||(target.type==='widget-stack'?target.el:null);if(!targetStack)return false;

  }
  syncAppOrderFromPositions();renderHome();setArrangeMode(true);showToast('底栏位置已保存');return true;
 }

};

function ensureArrangeToolbar(){let bar=document.getElementById('mistArrangeToolbar');if(bar)return bar;bar=document.createElement('div');bar.id='mistArrangeToolbar';bar.className='mist-arrange-toolbar';bar.innerHTML='<button type="button" data-action="open-widget-picker">＋ 添加组件</button><button type="button" data-action="finish-arrange">完成</button>';phone.appendChild(bar);return bar;}

function widgetPicker(){const defs=getCustomWidgets();const base=[['hero','个人欢迎组件'],['moodDate','心情与日期'],['collage','相簿精选'],['journalFeature','手账精选'],['musicPlayer','音乐播放器'],['quote','每日短句']];const rows=base.map(([id,title])=>`<button type="button" class="mist-widget-picker-row" data-action="add-base-widget" data-widget="${id}"><span class="mist-widget-picker-icon">${({hero:'M',moodDate:'◷',collage:'▧',journalFeature:'J',musicPlayer:'♫',quote:'“'})[id]}</span><span><strong>${title}</strong><small>系统组件 · 添加到当前桌面</small></span><b>＋</b></button>`).join('');const customs=defs.map(d=>`<button type="button" class="mist-widget-picker-row" data-action="add-custom-widget-instance" data-widget="${escapeHTML(d.id)}"><span class="mist-widget-picker-icon">${escapeHTML(d.mark||'◫')}</span><span><strong>${escapeHTML(d.title)}</strong><small>自定义组件 · 可重复添加</small></span><b>＋</b></button>`).join('');openModal('添加桌面组件',`<p class="mist-widget-picker-intro">选择一个组件放到当前桌面。添加后仍可长按移动到其他屏幕。</p><div class="mist-widget-picker-list">${rows}${customs||'<p class="tiny muted">还没有自定义组件。可以在晶透工坊中创建并保存。</p>'}<button type="button" class="soft-btn" data-action="create-custom-widget" style="width:100%;margin-top:8px">＋ 在工坊创建新组件</button></div>`);}
function addWidgetInstance(defId){const defs=getCustomWidgets(),def=defs.find(d=>d.id===defId);if(!def)return;const inst={id:'cwinst-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,6),widgetId:def.id};const instances=getWidgetInstances();instances.push(inst);store.set('customWidgetInstances',instances);const p=widgetOrder[activePage]||[];widgetOrder={...widgetOrder,[activePage]:[...p,inst.id]};store.set('widgetOrder',widgetOrder);closeModal();if(currentApp==='studio')closeApp();renderHome();goPage(activePage,false);setArrangeMode(true);showToast('组件已添加到当前桌面');}
function addBaseWidget(id){const built=['hero','moodDate','collage','journalFeature','musicPlayer','quote'];if(!built.includes(id))return;Object.keys(widgetOrder||{}).forEach(p=>{widgetOrder[p]=(widgetOrder[p]||[]).filter(x=>x!==id)});widgetOrder={...widgetOrder,[activePage]:[...(widgetOrder[activePage]||[]),id]};store.set('widgetOrder',widgetOrder);closeModal();renderHome();goPage(activePage,false);setArrangeMode(true);showToast('组件已放到当前桌面');}
function createWidgetModal(editId=''){
 const existing=getCustomWidgets().find(d=>d.id===editId)||{};const targetOptions=apps.map(a=>`<option value="${a.id}" ${existing.target===a.id?'selected':''}>${escapeHTML(a.name)}</option>`).join('');

}
function cssPanelHTML(kind){const theme=kind==='theme',key=theme?customThemeCssKey:customBubbleCssKey,presets=theme?getThemePresets():getBubblePresets(),code=store.get(key,'');const initial=theme?`.phone {\n  --wallpaper: #f5edf2;\n  --ink: #62525c;\n  --muted: #927f8b;\n  --accent: #c894aa;\n  --glass: rgba(255,255,255,.22);\n  --glass-strong: rgba(255,255,255,.36);\n  --glass-border: rgba(255,255,255,.62);\n  --dock: rgba(255,255,255,.24);\n}`:`.phone .bubble-row.user .bubble {\n  background: #c894aa;\n  color: #ffffff;\n  border-radius: 18px 18px 5px 18px;\n  border: 1px solid rgba(255,255,255,.45);\n}\n.phone .bubble-row:not(.user) .bubble {\n  background: rgba(255,255,255,.82);\n  color: #51434d;\n  border-radius: 18px 18px 18px 5px;\n  border: 1px solid rgba(255,255,255,.7);\n}`;const current=code||initial;
 const cards=presets.map(p=>`<div class="mist-css-preset-row"><div><strong>${escapeHTML(p.name)}</strong><small>${new Date(p.createdAt||Date.now()).toLocaleDateString('zh-CN')}</small></div><button class="small-btn soft-btn" data-action="load-css-preset" data-kind="${kind}" data-preset="${escapeHTML(p.id)}">编辑</button><button class="small-btn" data-action="apply-css-preset" data-kind="${kind}" data-preset="${escapeHTML(p.id)}">应用</button><button class="small-btn soft-btn" data-action="delete-css-preset" data-kind="${kind}" data-preset="${escapeHTML(p.id)}">删除</button></div>`).join('');
 return `<section class="mist-custom-panel"><div class="mist-custom-panel-head"><div><small>${theme?'THEME CSS / 01':'CHAT BUBBLES / 02'}</small><h3>${theme?'自定义主题 CSS':'自定义消息气泡 CSS'}</h3><p>${theme?'直接编辑手机主题变量或粘贴自己的 CSS。':'分别自定义你发送的消息与角色消息的气泡样式。'}</p></div><span class="mist-panel-glyph">${theme?'{}':'“”'}</span></div><form id="${theme?'mistThemeCssForm':'mistBubbleCssForm'}" class="mist-css-form"><label class="field-label">预设名称（保存时使用）</label><input class="field" id="${theme?'mistThemePresetName':'mistBubblePresetName'}" maxlength="32" placeholder="例如：雾紫玻璃主题"><label class="field-label">CSS 代码</label><textarea class="textarea mist-css-editor" id="${theme?'mistThemeCssCode':'mistBubbleCssCode'}" spellcheck="false" autocapitalize="off" autocomplete="off">${escapeHTML(current)}</textarea><div class="mist-css-actions"><button class="soft-btn" type="button" data-action="apply-css-now" data-kind="${kind}">预览并应用</button><button class="primary-btn" type="submit">保存为自定义预设</button><button class="soft-btn" type="button" data-action="copy-css-code" data-kind="${kind}">复制代码</button><button class="soft-btn" type="button" data-action="clear-css-now" data-kind="${kind}">清除自定义 CSS</button></div></form><div class="mist-css-presets"><div class="row-between"><strong>已保存预设</strong><span class="tiny muted">${presets.length} 个</span></div>${cards||'<p class="tiny muted" style="padding:10px 0">尚未保存自定义预设。</p>'}</div></section>`;
}
function createAdvancedStudioPanels(){
 const host=document.querySelector('#appScreen .atelier-keypad');
 if(!host||host.querySelector('.mist-advanced-studio-panels'))return;
 const panel=document.createElement('div');panel.className='mist-advanced-studio-panels';
 const states=store.get('studioFoldStates',{})||{};
 const fold=(key,title,sub,glyph,body)=>`<details class="studio-fold atelier-fold atelier-module-fold mist-advanced-fold" data-studio-fold="${key}" ${states[key]?'open':''}><summary><span class="fold-emblem">${glyph}</span><span class="fold-copy"><strong>${title}</strong><small>${sub}</small></span><span class="fold-chevron">＋</span></summary><div class="fold-body">${body}</div></details>`;
 const defs=getCustomWidgets();
 const widgetCards=defs.map(d=>`<div class="mist-saved-widget-row"><div class="mist-saved-widget-preview ${d.size==='wide'?'wide':''}"><span>${escapeHTML(d.mark||'◫')}</span><strong>${escapeHTML(d.title)}</strong><small>${escapeHTML(d.body||'')}</small></div><div class="mist-saved-widget-actions"><button class="small-btn" data-action="add-custom-widget-instance" data-widget="${escapeHTML(d.id)}">添加到桌面</button><button class="small-btn soft-btn" data-action="edit-custom-widget" data-widget="${escapeHTML(d.id)}">编辑</button><button class="small-btn soft-btn" data-action="delete-custom-widget" data-widget="${escapeHTML(d.id)}">删除</button></div></div>`).join('');
 const widgetManager=`<section class="mist-custom-panel mist-widget-manager"><div class="mist-custom-panel-head"><div><small>HOME SCREEN / WIDGETS</small><h3>桌面组件工坊</h3><p>在这里创建和管理桌面卡片。保存后可从整理模式左上角添加，并能长按移动到其他桌面。</p></div><span class="mist-panel-glyph">▦</span></div><div class="mist-grid-setting"><div><strong>桌面软件密度</strong><small>每行最多 4 个，默认 4 行；最多可扩展到 8 行</small></div><select class="select-field" id="mistHomeGridRows">${[4,5,6,7,8].map(n=>`<option value="${n}" ${gridRows===n?'selected':''}>${n} 行 · ${n*4} 个位置/桌面</option>`).join('')}</select></div><button type="button" class="primary-btn" data-action="create-custom-widget" style="width:100%;margin-top:12px">＋ 创建并保存桌面组件</button><div class="mist-saved-widget-list">${widgetCards||'<p class="tiny muted" style="padding:14px 3px">还没有自定义组件。创建后可重复添加到任意桌面。</p>'}</div></section>`;
 panel.innerHTML=fold('home-widgets','桌面组件工坊','组件创建 · 桌面密度 · 已保存组件','▦',widgetManager)+fold('custom-theme-css','自定义主题 CSS','主题外观 · 实时预览 · 保存预设','✧',cssPanelHTML('theme'))+fold('custom-bubble-css','自定义气泡 CSS','消息气泡 · 实时预览 · 保存预设','◉',cssPanelHTML('bubble'));
 host.appendChild(panel);
 const row=panel.querySelector('#mistHomeGridRows');
 if(row)row.addEventListener('change',()=>{const n=Math.max(4,Math.min(8,Number(row.value)||4));gridRows=n;store.set(ROW_KEY,n);homePositions={};homePositions=ensurePositions();savePositions();renderHome();goPage(activePage,false);showToast(`桌面已调整为 4 列 ${n} 行`);});
}
function refreshAdvancedStudio(){const old=document.querySelector('.mist-advanced-studio-panels');if(old)old.remove();createAdvancedStudioPanels();applyCustomCss();}
const originalRenderApp=renderApp;
renderApp=function(id){originalRenderApp(id);if(id==='studio')createAdvancedStudioPanels();};
const originalHandleAction=handleAction;
handleAction=function(action,el){const d=el?.dataset||{};
 switch(action){
  case 'open-widget-picker':widgetPicker();return;
  case 'finish-arrange':setArrangeMode(false);return;
  case 'add-base-widget':addBaseWidget(d.widget);return;
  case 'add-custom-widget-instance':addWidgetInstance(d.widget);return;
  case 'create-custom-widget':createWidgetModal();return;
  case 'edit-custom-widget':createWidgetModal(d.widget);return;
  case 'delete-custom-widget':{const def=getCustomWidgets().find(x=>x.id===d.widget);if(!def)return;const next=getCustomWidgets().filter(x=>x.id!==d.widget);store.set('customHomeWidgets',next);const inst=getWidgetInstances().filter(x=>x.widgetId!==d.widget);store.set('customWidgetInstances',inst);Object.keys(widgetOrder||{}).forEach(p=>widgetOrder[p]=(widgetOrder[p]||[]).filter(id=>!inst.some(x=>x.id===id)));store.set('widgetOrder',widgetOrder);applyWidgetCss();refreshAdvancedStudio();renderHome();showToast('自定义组件已删除');return;}
  case 'apply-css-now':{const isTheme=d.kind==='theme',key=isTheme?customThemeCssKey:customBubbleCssKey,id=isTheme?'mistThemeCssCode':'mistBubbleCssCode';const code=safeCss(document.getElementById(id)?.value||'');store.set(key,code);applyCustomCss();showToast('CSS 已应用');return;}
  case 'clear-css-now':{const isTheme=d.kind==='theme',key=isTheme?customThemeCssKey:customBubbleCssKey,id=isTheme?'mistThemeCssCode':'mistBubbleCssCode';store.set(key,'');const field=document.getElementById(id);if(field)field.value='';applyCustomCss();showToast('已清除自定义 CSS');return;}
  case 'copy-css-code':{const id=d.kind==='theme'?'mistThemeCssCode':'mistBubbleCssCode',field=document.getElementById(id),text=field?.value||'';if(!text){showToast('当前没有可复制的 CSS');return;}if(navigator.clipboard?.writeText){navigator.clipboard.writeText(text).then(()=>showToast('CSS 代码已复制')).catch(()=>{field.focus();field.select();try{document.execCommand('copy');showToast('CSS 代码已复制')}catch(e){showToast('请长按代码框手动复制')}})}else{field.focus();field.select();try{document.execCommand('copy');showToast('CSS 代码已复制')}catch(e){showToast('请长按代码框手动复制')}}return;}
  case 'apply-css-preset':case 'load-css-preset':case 'delete-css-preset':{const isTheme=d.kind==='theme',key=isTheme?customThemeCssKey:customBubbleCssKey,listKey=isTheme?'customThemeCssPresets':'customBubbleCssPresets',fieldId=isTheme?'mistThemeCssCode':'mistBubbleCssCode',presets=isTheme?getThemePresets():getBubblePresets(),preset=presets.find(p=>p.id===d.preset);if(!preset)return;if(action==='delete-css-preset'){store.set(listKey,presets.filter(p=>p.id!==d.preset));refreshAdvancedStudio();showToast('预设已删除');return;}const field=document.getElementById(fieldId);if(field)field.value=preset.code||'';if(action==='apply-css-preset'){store.set(key,preset.code||'');applyCustomCss();showToast('已应用 '+preset.name);}else{const nameField=document.getElementById(isTheme?'mistThemePresetName':'mistBubblePresetName');if(nameField)nameField.value=preset.name||'';showToast('已载入代码，可继续修改');}return;}
  default:originalHandleAction(action,el);
 }
};
// Live preview of the CSS textareas, scoped to the relevant style layer.
document.addEventListener('input',e=>{if(e.target?.id==='mistThemeCssCode')setStyleTag('mist-user-theme-css',e.target.value);if(e.target?.id==='mistBubbleCssCode')setStyleTag('mist-user-bubble-css',e.target.value);});

 const isTheme=f?.id==='mistThemeCssForm',isBubble=f?.id==='mistBubbleCssForm';if(!isTheme&&!isBubble)return;e.preventDefault();e.stopImmediatePropagation();const isT=isTheme,key=isT?customThemeCssKey:customBubbleCssKey,listKey=isT?'customThemeCssPresets':'customBubbleCssPresets',fieldId=isT?'mistThemeCssCode':'mistBubbleCssCode',nameId=isT?'mistThemePresetName':'mistBubblePresetName';const code=safeCss(document.getElementById(fieldId)?.value||'');const name=document.getElementById(nameId)?.value?.trim()||(isT?'自定义主题':'自定义气泡')+' '+new Date().toLocaleDateString('zh-CN');const list=isT?getThemePresets():getBubblePresets();const item={id:'css-'+Date.now().toString(36),name,code,createdAt:Date.now()};list.unshift(item);store.set(listKey,list.slice(0,30));store.set(key,code);applyCustomCss();refreshAdvancedStudio();showToast('已保存并应用 '+name);
},true);
// Responsive editing visuals and load saved custom CSS before first repaint.
applyCustomCss();ensureArrangeToolbar();
// Reliable chat-bubble color selection: apply immediately and keep the user in the same settings component.
document.addEventListener('click',function(e){
 const target=e.target instanceof Element?e.target.closest('[data-action="chat-bubble-color"]'):null;
 if(!target)return;
 const side=target.dataset.side,color=target.dataset.color;
 const valid=side==='user'?['blue','rose','lilac','mint','peach','ink']:side==='assistant'?['white','mist','rose','ice','lilac','mint','night']:[];
 if(!valid.includes(color))return;
 e.preventDefault();e.stopPropagation();e.stopImmediatePropagation();
 chatAppearance[side==='user'?'userBubbleColor':'assistantBubbleColor']=color;
 store.set('chatAppearance',chatAppearance);applyAppearance();
 document.querySelectorAll('[data-action="chat-bubble-color"]').forEach(btn=>{const active=btn.dataset.side===side&&btn.dataset.color===color;btn.classList.toggle('active',active);btn.setAttribute('aria-pressed',active?'true':'false');});
 showToast(side==='user'?'我的气泡颜色已更新':'角色气泡颜色已更新');
},true);

homePositions=ensurePositions();savePositions();renderHome();
})();

<script id="mist-presence-and-message-actions">
(function(){
  'use strict';
  const $ = id => document.getElementById(id);
  const now = () => Date.now();
  const rand = (a,b) => Math.floor(a + Math.random() * (b-a+1));
  const hasFn = name => typeof window[name] === 'function';

  // The supplied backup stores presence in presenceStatus / presenceUpdatedAt / offlineMessage.
  // Keep those field names so the exported data and this phone stay compatible.
  let contactsChanged = false;
  (contacts || []).forEach(c => {
    if (typeof c.presenceEnabled !== 'boolean') { c.presenceEnabled = true; contactsChanged = true; }
    if (!['online','offline'].includes(c.presenceStatus)) { c.presenceStatus = 'online'; contactsChanged = true; }
    if (!Number(c.presenceUpdatedAt)) { c.presenceUpdatedAt = now(); contactsChanged = true; }
    if (typeof c.offlineMessage !== 'string') { c.offlineMessage = ''; contactsChanged = true; }
    if (!Number(c.offlineMessageRepliesThisSession) && c.offlineMessageRepliesThisSession !== 0) { c.offlineMessageRepliesThisSession = 0; contactsChanged = true; }
    if (!Number(c.presenceNextChangeAt) || Number(c.presenceNextChangeAt) < now()) {
      const importedDue = Number(c.offlineMessageNextChangeAt);
      c.presenceNextChangeAt = importedDue > now() ? importedDue : now() + rand(30*60*1000, 70*60*1000);
      contactsChanged = true;
    }
    if (!Number(c.offlineUserSessionAt)) { c.offlineUserSessionAt = 0; contactsChanged = true; }
  });
  if (contactsChanged) store.set('contacts', contacts);

  function ensureUserProfile(){
    if (!userProfile || typeof userProfile !== 'object' || Array.isArray(userProfile)) userProfile = {};
    if (!['online','offline'].includes(userProfile.presenceStatus)) userProfile.presenceStatus = 'online';
    if (typeof userProfile.offlineMessage !== 'string') userProfile.offlineMessage = '暂时不在线，有事先留言。';
    if (!Number(userProfile.presenceUpdatedAt)) userProfile.presenceUpdatedAt = now();
    return userProfile;
  }
  function saveUserPresence(){ ensureUserProfile(); store.set('userProfile', userProfile); }
  function saveContactsPresence(){ store.set('contacts', contacts); }
  function defaultOfflineMessage(contact){
    const persona = String(contact?.persona || contact?.prompt || '').toLowerCase();
    if (/冷淡|寡言|话少|沉默/.test(persona)) return '暂时有事，看到消息会回。';
    if (/忙|工作|上学|研究|医生|警察/.test(persona)) return '现在不太方便看手机，晚点回复。';
    return '我暂时不在，看到后回复你。';
  }
  async function prepareOfflineMessage(contact){
    const fallback = String(contact.offlineMessage || '').trim() || defaultOfflineMessage(contact);
    // Generate before switching the status. If generation fails, retain the existing saved note.
    if (!(apiSettings && apiSettings.key && apiSettings.model)) return fallback;
    try {
      const endpoint = normalizeEndpoint(apiSettings.endpoint);
      const history = (Array.isArray(chats[contact.id]) ? chats[contact.id] : [])
        .filter(m => m && m.role !== 'system' && !m.awaitingApi)
        .slice(-8).map(m => chatApiHistoryItem(m));
      const persona = String(contact.prompt || contact.persona || '').trim().slice(0,5000);
      const sys = '你正在为一个虚构角色生成手机里的“离线留言/状态短句”。只输出一句自然、简短、符合人物口吻的中文留言，约 5–24 个字。不写动作描写，不写旁白，不解释规则，不使用固定客服腔。此留言会在角色下线前生成并保存，离线期间不得变化。';
      const payload = {model:apiSettings.model,messages:[{role:'system',content:sys},{role:'system',content:'角色设定：\n'+persona},...history,{role:'user',content:'请生成这次离线期间固定显示的一句离线留言。只输出留言本身。'}],temperature:Math.min(0.8,Math.max(0.2,Number(apiSettings.temperature ?? 0.65)))};
      const res = await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+apiSettings.key},body:JSON.stringify(payload)});
      if (!res.ok) throw new Error('HTTP '+res.status);
      const json = await res.json();
      const raw = json?.choices?.[0]?.message?.content;
      const segments = typeof parseAssistantSegments === 'function' ? parseAssistantSegments(raw) : [String(raw||'')];
      const text = segments.join(' ').replace(/^['“”「」\s]+|['“”「」\s]+$/g,'').trim().split(/\n+/)[0].slice(0,120);
      return text || fallback;
    } catch(e) {
      return fallback;
    }
  }
  function chatHasQueuedUserMessages(contactId){
    return Array.isArray(chats[contactId]) && chats[contactId].some(m => m && m.role==='user' && m.awaitingApi===true);
  }
  function refreshCurrentChat(contact){
    if (currentApp==='starChat' && activeContactId===contact.id) renderApp('starChat');
  }
  async function moveContactOffline(contact){
    if (!contact || contact.presenceEnabled===false || contact._presenceTransitioning) return;
    contact._presenceTransitioning = true;
    try {
      const note = await prepareOfflineMessage(contact);
      // Save the exact note while the character is still online. The offline state is set only after this completes.
      contact.offlineMessage = String(note || defaultOfflineMessage(contact)).trim();
      contact.offlineMessageNextChangeAt = now() + rand(5*60*1000,14*60*1000);
      saveContactsPresence();

<script>
(function(){
  // SOI backup schema uses per-contact `bilingual` and `bilingualLanguage`; preserve these fields independently per role.
  contacts.forEach(c=>{if(typeof c.bilingual!=='boolean')c.bilingual=false;if(typeof c.bilingualLanguage!=='string'||!c.bilingualLanguage.trim())c.bilingualLanguage='English';});
  store.set('contacts',contacts);

  const previousChatSettingsRenderer=renderChatSettings;
  renderChatSettings=function(){
    let html=previousChatSettingsRenderer();
    const c=contacts.find(x=>x.id===activeContactId);
    if(!c||!html||!html.includes('<div class="mist-settings-section-title">互动记忆</div>'))return html;
    const enabled=c.bilingual===true;
    const panel=`<div class="mist-settings-section-title">双语回复</div><section class="mist-settings-group"><div class="mist-preference-row"><div class="mist-preference-copy"><strong>双语回复</strong><small>开启后，每条角色回复都会显示拟真语言条；模型提供译文时会同时显示对照文本，不依赖音色 ID 或独立语音接口。</small></div><button type="button" class="mist-switch ${enabled?'on':''}" role="switch" aria-checked="${enabled?'true':'false'}" data-action="toggle-bilingual-replies"><span></span></button></div><div class="mist-bilingual-setting-language"><label class="field-label" for="mistBilingualLanguage">第二语言</label><select id="mistBilingualLanguage" class="field" data-bilingual-language>${bilingualLanguageSelectOptions(c.bilingualLanguage||'English')}</select><p class="tiny muted">语言设置按联系人保存。语言条为本地拟真界面，不需要额外配置音色 ID；有译文时显示对照文本。</p></div></section>`;
    if(!html.includes('data-action="toggle-bilingual-replies"'))html=html.replace('<div class="mist-settings-section-title">互动记忆</div>',panel+'<div class="mist-settings-section-title">互动记忆</div>');
    return html;
  };

  const priorHandleActionBilingual=handleAction;
  handleAction=function(action,el){
    if(action==='toggle-bilingual-replies'){
      const c=contacts.find(x=>x.id===activeContactId);if(!c)return;
      c.bilingual=c.bilingual!==true;
      if(!c.bilingualLanguage)c.bilingualLanguage='English';
      store.set('contacts',contacts);renderApp('starChat');showToast(c.bilingual?'已开启双语回复':'已关闭双语回复');return;
    }
    return priorHandleActionBilingual(action,el);
  };

  document.addEventListener('change',function(event){
    const select=event.target?.closest?.('[data-bilingual-language]');if(!select)return;
    const c=contacts.find(x=>x.id===activeContactId);if(!c)return;
    c.bilingualLanguage=String(select.value||'English');store.set('contacts',contacts);
    showToast('对照语言已设为 '+bilingualLanguageLabel(c.bilingualLanguage));
  });

  // The translation track is a deliberately simulated audio-style control. It only animates locally and never requests an audio/API service.
  document.addEventListener('click',function(event){
    const button=event.target?.closest?.('.mist-bilingual-play');if(!button)return;
    event.preventDefault();event.stopPropagation();
    const panel=button.closest('.mist-bilingual-translation');if(!panel)return;
    const wasPlaying=panel.classList.contains('is-playing');
    document.querySelectorAll('.mist-bilingual-translation.is-playing').forEach(other=>{
      other.classList.remove('is-playing');const b=other.querySelector('.mist-bilingual-play');if(b){b.setAttribute('aria-pressed','false');b.setAttribute('aria-label','播放语言语音条');const g=b.querySelector('.mist-bilingual-play-glyph');if(g)g.textContent='▶';}
      if(other._mistVoiceTimer){clearTimeout(other._mistVoiceTimer);other._mistVoiceTimer=null;}
    });
    if(wasPlaying)return;
    panel.classList.add('is-playing');button.setAttribute('aria-pressed','true');button.setAttribute('aria-label','暂停语言语音条');const glyph=button.querySelector('.mist-bilingual-play-glyph');if(glyph)glyph.textContent='Ⅱ';
    const seconds=Math.max(2,Math.min(24,Number(panel.dataset.simDuration)||4));
    panel._mistVoiceTimer=setTimeout(()=>{panel.classList.remove('is-playing');panel._mistVoiceTimer=null;const b=panel.querySelector('.mist-bilingual-play');if(b){b.setAttribute('aria-pressed','false');b.setAttribute('aria-label','播放语言语音条');const g=b.querySelector('.mist-bilingual-play-glyph');if(g)g.textContent='▶';}},seconds*1000);
  });

  const style=document.createElement('style');style.id='mist-bilingual-reply-style';style.textContent=`
  .mist-bilingual-setting-language{padding:10px 13px 13px;border-top:1px solid rgba(128,116,135,.12)}
  .mist-bilingual-setting-language .field-label{display:block;margin:0 0 7px;font-size:11px;color:var(--muted,#85808a)}
  .mist-bilingual-setting-language .field{width:100%;min-height:40px}
  .mist-bilingual-setting-language .tiny{margin:7px 0 0;line-height:1.55}
  .mist-bilingual-translation{display:block;margin-top:10px;padding-top:0;color:inherit;opacity:.97;overflow-wrap:anywhere;word-break:break-word;min-width:0}
  .mist-bilingual-divider{display:flex;align-items:center;gap:8px;margin:0 0 9px;opacity:.64}
  .mist-bilingual-divider>span{height:1px;flex:1;background:currentColor;opacity:.28}
  .mist-bilingual-divider small{font-size:8px;font-weight:800;letter-spacing:.13em;line-height:1.2;white-space:nowrap}
  .mist-bilingual-voice-strip{display:flex;align-items:flex-start;gap:9px;padding:10px 11px;border:1px solid color-mix(in srgb,currentColor 13%,transparent);border-radius:13px;background:color-mix(in srgb,currentColor 5%,transparent);min-width:0;box-sizing:border-box}
  .mist-bilingual-play{flex:0 0 30px;width:30px;height:30px;margin-top:2px;display:grid;place-items:center;border:1px solid color-mix(in srgb,currentColor 18%,transparent);border-radius:50%;background:color-mix(in srgb,currentColor 8%,transparent);color:inherit;cursor:pointer;transition:transform .18s ease,background .18s ease,border-color .18s ease;box-shadow:none;padding:0}
  .mist-bilingual-play:hover{transform:scale(1.05);background:color-mix(in srgb,currentColor 13%,transparent)}
  .mist-bilingual-play-glyph{display:block;font-size:10px;line-height:1;transform:translateX(1px)}
  .mist-bilingual-translation.is-playing .mist-bilingual-play-glyph{transform:none;font-size:11px}
  .mist-bilingual-voice-body{flex:1;min-width:0}
  .mist-bilingual-voice-meta{display:flex;align-items:center;gap:6px;min-width:0;line-height:1.2;margin:0 0 7px}
  .mist-bilingual-lang-chip{display:inline-flex;align-items:center;justify-content:center;border-radius:5px;padding:3px 5px;border:1px solid color-mix(in srgb,currentColor 15%,transparent);font-size:8px;font-weight:850;letter-spacing:.08em;line-height:1.2;white-space:nowrap}
  .mist-bilingual-voice-caption{font-size:9px;font-weight:700;opacity:.72;letter-spacing:.04em}
  .mist-bilingual-voice-duration{margin-left:auto;font-size:9px;font-variant-numeric:tabular-nums;opacity:.63;white-space:nowrap}
  .mist-bilingual-waveform{height:17px;display:flex;align-items:center;gap:2px;overflow:hidden;margin:0 0 7px;opacity:.7}
  .mist-bilingual-waveform i{display:block;flex:1;min-width:2px;max-width:4px;height:var(--bar-height,7px);border-radius:4px;background:currentColor;opacity:.55;transform-origin:center;transition:opacity .2s ease}
  .mist-bilingual-translation-text{font-size:.91em;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word;opacity:.94}
  .mist-bilingual-translation.is-playing .mist-bilingual-play{background:color-mix(in srgb,currentColor 14%,transparent);border-color:color-mix(in srgb,currentColor 35%,transparent)}
  .mist-bilingual-translation.is-playing .mist-bilingual-play-glyph{font-size:0;position:relative;width:8px;height:10px;border-left:2.5px solid currentColor;border-right:2.5px solid currentColor;transform:none}
  .mist-bilingual-translation.is-playing .mist-bilingual-waveform i{opacity:.95;animation:mistBilingualWave .62s ease-in-out infinite alternate;animation-delay:calc(var(--bar-index,0) * -31ms)}
  @keyframes mistBilingualWave{from{transform:scaleY(.55)}to{transform:scaleY(1.13)}}
  @media(max-width:380px){.mist-bilingual-voice-strip{padding:8px;gap:7px}.mist-bilingual-play{width:27px;height:27px;flex-basis:27px}.mist-bilingual-voice-caption{font-size:8px}}
  @media(prefers-reduced-motion:no-preference){.mist-bilingual-translation{animation:mistTranslationFade .22s ease-out}@keyframes mistTranslationFade{from{opacity:0;transform:translateY(2px)}to{opacity:.97;transform:translateY(0)}}}
  @media(prefers-reduced-motion:reduce){.mist-bilingual-translation.is-playing .mist-bilingual-waveform i{animation:none}}
  `;document.head.appendChild(style);
})();
</script>

<script>
(function(){
  // Migrate older compound assistant messages into separate chat bubbles and clean accidental prompt leaks.
  let changed=false;
  for(const [contactId,rows] of Object.entries(chats||{})){
    if(!Array.isArray(rows))continue;
    const next=[];
    for(const message of rows){
      if(!message||message.role!=='assistant'||message.mistVoice||message.mistShareCard||message.imageData||typeof message.content!=='string'){
        next.push(message);continue;
      }
      const content=String(message.content||'');
      const segments=parseAssistantSegments(content);
      if(!segments.length){if(isInternalPromptLeak(content)||/^\s*[\[{]\s*["']?(?:chatResponse|messages|response|role|type|content)\b/i.test(content)){changed=true;continue;}next.push(message);continue;}
      if(segments.length>1){
        changed=true;
        const pairs=message.translation?[]:parseAssistantBilingualItems(content);
        segments.forEach((segment,index)=>{
          const copy={...message,content:segment,timestamp:(Number(message.timestamp)||Date.now())+index};
          if(index>0&&!pairs[index]?.translation)delete copy.translation;
          if(pairs[index]?.translation){copy.translation=pairs[index].translation;copy.translationLanguage=copy.translationLanguage||'English';copy.bilingual=true;}
          next.push(copy);
        });
      }else if(segments[0]!==content.trim()){
        changed=true;next.push({...message,content:segments[0]});
      }else next.push(message);
    }
    chats[contactId]=next.slice(-100);
  }
  if(changed)store.set('chats',chats);

  const style=document.createElement('style');style.id='mist-language-strip-finish';style.textContent=`
    .mist-bilingual-translation{margin-top:9px!important;min-width:0;max-width:100%;}
    .mist-bilingual-divider{margin-bottom:7px!important;}
    .mist-bilingual-voice-strip{position:relative;align-items:center!important;gap:9px!important;padding:9px 10px!important;border-radius:14px!important;background:linear-gradient(135deg,color-mix(in srgb,var(--accent,#c894aa) 7%,transparent),color-mix(in srgb,currentColor 3%,transparent))!important;}
    .mist-bilingual-play{flex-basis:29px!important;width:29px!important;height:29px!important;border-radius:50%!important;}
    .mist-bilingual-waveform{height:19px!important;margin-bottom:0!important;gap:2px!important;}
    .mist-bilingual-voice-meta{margin-bottom:5px!important;}
    .mist-bilingual-lang-chip{background:color-mix(in srgb,var(--accent,#c894aa) 9%,transparent);}
    .mist-bilingual-translation-text{padding-top:8px;margin-top:7px;border-top:1px solid color-mix(in srgb,currentColor 9%,transparent);}
    .mist-bilingual-translation:not(:has(.mist-bilingual-translation-text)) .mist-bilingual-waveform{margin-bottom:1px!important;}
    .mist-voice-message{width:min(270px,72vw)!important;padding:11px!important;border-radius:16px!important;}
    .mist-voice-copy small{font-size:8px;line-height:1.45;}
    .mist-voice-player{display:flex;align-items:center;gap:10px;margin-top:10px;padding:9px;border:1px solid var(--glass-border);border-radius:13px;background:color-mix(in srgb,var(--accent) 6%,var(--glass));}
    .mist-voice-player .mist-voice-play{width:30px;height:30px;min-width:30px;flex:0 0 30px;display:grid;place-items:center;padding:0;border:1px solid color-mix(in srgb,var(--accent) 32%,var(--glass-border));border-radius:50%;background:var(--soft);color:var(--ink);cursor:pointer;font-size:10px;box-shadow:inset 0 1px 0 rgba(255,255,255,.7);}
    .mist-voice-play-glyph{display:block;line-height:1;}
    .mist-voice-player-body{flex:1;min-width:0;}
    .mist-voice-player-meta{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px;font-size:7px;letter-spacing:1px;color:var(--muted);}
    .mist-voice-player-meta time{font-size:8px;letter-spacing:0;font-variant-numeric:tabular-nums;}
    .mist-voice-waveform{height:19px;display:flex;align-items:center;gap:2px;overflow:hidden;}
    .mist-voice-waveform i{display:block;flex:1;min-width:2px;max-width:5px;height:var(--bar-height,7px);border-radius:4px;background:var(--accent);opacity:.62;transform-origin:center;}
    .mist-voice-message.is-sim-playing .mist-voice-play{background:var(--accent)!important;color:var(--wallpaper)!important;}
    .mist-voice-message.is-sim-playing .mist-voice-waveform i{opacity:.98;animation:mistVoiceWave .55s ease-in-out infinite alternate;animation-delay:calc(var(--bar-index,0) * -27ms);}
    @keyframes mistVoiceWave{from{transform:scaleY(.52)}to{transform:scaleY(1.08)}}
    .mist-voice-actions{margin-top:8px!important;}
    .mist-voice-actions .mist-voice-transcript-toggle{padding:6px 8px;font-size:8px;}
    @media(max-width:380px){.mist-bilingual-voice-strip{padding:8px!important}.mist-voice-message{width:min(235px,67vw)!important;padding:8px!important}.mist-voice-player{padding:7px;gap:7px;}}
  `;document.head.appendChild(style);
})();
</script>
